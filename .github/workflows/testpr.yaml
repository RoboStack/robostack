# Pull-request build: only the distributions a PR touches are built
# (a change outside distros/ affects all of them), on all five platforms.
name: Build

on:
  pull_request:
  workflow_dispatch:
    inputs:
      distros:
        description: Space-separated distributions to build (default all)
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  PYTHONIOENCODING: utf-8
  SAVE_CACHE_AS_ARTIFACT: 'true'

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # the build:<distro> and build:<platform> labels
    outputs:
      distros: ${{ steps.plan.outputs.distros }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Disable git auto-maintenance
        run: git config --global maintenance.auto false && git config --global gc.auto 0
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          locked: true  # the lock file must match pixi.toml
          pixi-version: v0.81.0
          cache-write: false  # saved from main only (pixi-cache.yaml)
      - name: Which distributions changed
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
          SELECTED: ${{ inputs.distros }}
          GH_TOKEN: ${{ github.token }}
        run: |
          labels="[]"
          if [ -n "$SELECTED" ]; then
            distros=$(pixi run python -c 'import json,os; print(json.dumps(os.environ["SELECTED"].split()))')
          elif [ -n "$BASE" ]; then
            # build:<distro> labels limit the build to those distributions; read now (not
            # from the event) so that a re-run sees labels added after the push
            labels=$(pixi run gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels -q '[.labels[].name]')
            distros=$(pixi run python tools/robostack.py changed-distros --base "$BASE" --labels "$labels")
          else
            distros=$(pixi run python tools/robostack.py changed-distros --base HEAD --all)
          fi
          echo "distros=$distros" | tee -a "$GITHUB_OUTPUT"
          # build:linux / build:osx / build:win labels limit the platforms (all without)
          echo "targets=$(pixi run python tools/robostack.py build-targets --labels "$labels")" | tee -a "$GITHUB_OUTPUT"
          # DO NOT MERGE: only lyrical on linux-64 and win-64, to try the staged build
          echo 'distros=["lyrical"]' | tee -a "$GITHUB_OUTPUT"
          echo 'targets=[{"os": "ubuntu-latest", "platform": "linux-64"}, {"os": "windows-2022", "platform": "win-64"}]' | tee -a "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # git auto-maintenance can leave a lock file in the git clones pixi caches
      # (e.g. vinca's), which breaks every later run restoring that cache
      - name: Disable git auto-maintenance
        run: git config --global maintenance.auto false && git config --global gc.auto 0 && git config --global core.longpaths true
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          locked: true  # the lock file must match pixi.toml
          pixi-version: v0.81.0
          cache-write: false  # saved from main only (pixi-cache.yaml)
      - name: Sanity checks (every distribution assembles, generated files up to date, sorted)
        run: pixi run rs check
      - name: Unit tests of the tooling
        run: pixi run test

  # The patches of every platform, checked once per distribution next to its builds
  # (each check is a rattler-build run, ~13 minutes for all of them on Windows): the
  # recipes of all platforms are generated and merged, since each platform selects
  # its own packages; applying a patch doesn't depend on the host.
  patches:
    needs: plan
    if: needs.plan.outputs.distros != '[]'
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.plan.outputs.distros) }}
    name: ${{ matrix.distro }} patches
    runs-on: ubuntu-latest
    env:
      DISTRO: ${{ matrix.distro }}
      # generate-recipes -n leaves out what is on the channel, like the builds do
      ROBOSTACK_UPLOAD_CHANNEL: ${{ vars.ROBOSTACK_UPLOAD_CHANNEL }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Disable git auto-maintenance
        run: git config --global maintenance.auto false && git config --global gc.auto 0 && git config --global core.longpaths true
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          locked: true  # the lock file must match pixi.toml
          pixi-version: v0.81.0
          cache-write: false  # saved from main only (pixi-cache.yaml)
      - name: Generate the recipes of every platform
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          work="distros/$DISTRO/work"
          all=$(mktemp -d)
          for platform in linux-64 linux-aarch64 osx-64 osx-arm64 win-64; do
            for attempt in 1 2 3; do
              if pixi run rs "$DISTRO" generate-recipes --platform "$platform" -n; then break; fi
              if [[ "$attempt" == 3 ]]; then echo "Recipe generation failed for $platform" >&2; exit 1; fi
              sleep 15
            done
            cp -rn "$work/recipes/." "$all/"  # a package's recipe doesn't depend on the platform
          done
          rm -rf "$work/recipes" && mv "$all" "$work/recipes"
          echo "$(ls "$work/recipes" | wc -l) recipes"
      - name: Check patches
        run: |
          pixi run rs "$DISTRO" check-orphaned-patches
          pixi run rs "$DISTRO" check-patches

  # The changed distributions on every platform, in vinca-gha's stages, one job per
  # batch of recipes (staged-build.yaml, generated by tools/staged_build.py).
  build:
    permissions:
      actions: write  # drop this pull request's superseded build caches
      contents: read
    needs: plan
    if: needs.plan.outputs.distros != '[]'
    uses: ./.github/workflows/staged-build.yaml
    with:
      distros: ${{ needs.plan.outputs.distros }}
      targets: ${{ needs.plan.outputs.targets }}  # tools/robostack.py BUILD_TARGETS
      upload: false

  # The ABI checks of all distributions as one pull-request comment, updated on every
  # push. Pull requests from forks get a read-only token, so the job is skipped for them:
  # they only have the job summaries.
  abi-comment:
    name: ABI check comment
    needs: build
    if: ${{ always() && github.event_name == 'pull_request' && needs.build.result != 'skipped' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Disable git auto-maintenance
        run: git config --global maintenance.auto false && git config --global gc.auto 0
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          locked: true  # the lock file must match pixi.toml
          pixi-version: v0.81.0
          cache-write: false  # saved from main only (pixi-cache.yaml)
      - uses: actions/download-artifact@v7
        with:
          pattern: abi-check-*
          merge-multiple: true
      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          shopt -s nullglob
          files=(abi-check-*.md)
          marker='<!-- robostack-abi-check -->'
          existing=$(pixi run gh api "repos/$REPO/issues/$PR/comments" --paginate -q ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          # no comment for pull requests that build nothing released before
          if ! grep -q '^| package |' "${files[@]}" /dev/null && [ -z "$existing" ]; then exit 0; fi
          {
            echo "$marker"
            echo "### ABI check (linux-64)"
            echo
            cat "${files[@]}"
            echo "<details><summary>About this check</summary>"
            echo
            echo "Each package this pull request built, compared with its newest released build (\`tools/abi_check.py\`, libabigail):"
            echo "- **compatible** / **additions**: the package can be bumped on its own;"
            echo "- **soname** / **incompatible**: the packages that depend on it need a rebuild (build number bump) in the same pull request."
            echo
            echo "Exported symbols are compared (the released packages are stripped, so struct layouts aren't); unchanged installed headers rule out layout and inline changes, changed ones are listed for review. Dependents to rebuild are the released ones linking to a changed library. A changed pin is part of the comparison."
            echo
            echo "</details>"
          } > body.md
          if [ -n "$existing" ]; then
            pixi run gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@body.md > /dev/null
          else
            pixi run gh api "repos/$REPO/issues/$PR/comments" -F body=@body.md > /dev/null
          fi

  # One stable check for branch protection / auto-merge: the build matrix differs
  # from PR to PR, so require this job instead of the individual builds.
  all-green:
    name: All green
    needs: [plan, check, patches, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded (or had nothing to build)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
