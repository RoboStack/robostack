jobs:
  stage_0_job_0:
    name: ros2-ament-xmllint ros2-osrf-testing-tools-cpp ros2-mujoco-vendor ros2-ament-cmake-xmllint
      osrf-testing-tools-cpp mujoco-vendor ament-xmllint ros2-performance-test-fixture
      ros2-rti-connext-dds-cmake-module ros2-mimick-vendor ament-cmake-xmllint ros2-rmw-connextdds-common
      ros2-sick-safetyscanners2-interfaces rti-connext-dds-cmake-module performance-test-fixture
      mimick-vendor ros2-rmw-connextdds sick-safetyscanners2-interfaces rmw-connextdds-common
      ros2-sick-safetyscanners2 rmw-connextdds sick-safetyscanners2
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
    needs: []
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Disable git auto-maintenance
      run: git config --global maintenance.auto false && git config --global gc.auto
        0
    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.11.0
      with:
        pixi-version: v0.81.0
        cache: 'true'
        log-level: v
        frozen: 'true'
    - name: Build ros2-ament-xmllint ros2-osrf-testing-tools-cpp ros2-mujoco-vendor
        ros2-ament-cmake-xmllint ros-humble-osrf-testing-tools-cpp ros-humble-mujoco-vendor
        ros-humble-ament-xmllint ros2-performance-test-fixture ros2-rti-connext-dds-cmake-module
        ros2-mimick-vendor ros-humble-ament-cmake-xmllint ros2-rmw-connextdds-common
        ros2-sick-safetyscanners2-interfaces ros-humble-rti-connext-dds-cmake-module
        ros-humble-performance-test-fixture ros-humble-mimick-vendor ros2-rmw-connextdds
        ros-humble-sick-safetyscanners2-interfaces ros-humble-rmw-connextdds-common
        ros2-sick-safetyscanners2 ros-humble-rmw-connextdds ros-humble-sick-safetyscanners2
      env:
        CURRENT_RECIPES: ros2-ament-xmllint ros2-osrf-testing-tools-cpp ros2-mujoco-vendor
          ros2-ament-cmake-xmllint ros-humble-osrf-testing-tools-cpp ros-humble-mujoco-vendor
          ros-humble-ament-xmllint ros2-performance-test-fixture ros2-rti-connext-dds-cmake-module
          ros2-mimick-vendor ros-humble-ament-cmake-xmllint ros2-rmw-connextdds-common
          ros2-sick-safetyscanners2-interfaces ros-humble-rti-connext-dds-cmake-module
          ros-humble-performance-test-fixture ros-humble-mimick-vendor ros2-rmw-connextdds
          ros-humble-sick-safetyscanners2-interfaces ros-humble-rmw-connextdds-common
          ros2-sick-safetyscanners2 ros-humble-rmw-connextdds ros-humble-sick-safetyscanners2
        BUILD_TARGET: osx-64
      run: |
        export CI=github
        export GIT_BRANCH=${GITHUB_REF_NAME}
        export FEEDSTOCK_NAME=${GITHUB_REPOSITORY##*/}
        .scripts/build_unix.sh --target $BUILD_TARGET
    permissions:
      id-token: write
      contents: read
      attestations: write
name: build
run-name: humble osx-64
concurrency:
  group: build-humble-osx-64
  cancel-in-progress: false
on:
  push:
    branches:
    - buildbranch_humble_osx_64
env:
  ROBOSTACK_DISTRO: humble
  # optional repository variable: upload to this prefix.dev channel instead
  # (e.g. a test channel), or 'none' to only build
  ROBOSTACK_UPLOAD_CHANNEL: ${{ vars.ROBOSTACK_UPLOAD_CHANNEL }}
