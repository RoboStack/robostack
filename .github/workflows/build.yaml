jobs:
  stage_0_job_0:
    name: beluga beluga-ros
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Disable git auto-maintenance
      run: git config --global maintenance.auto false && git config --global gc.auto
        0
    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.11.0
      with:
        pixi-version: v0.81.0
        cache: 'true'
        log-level: v
        frozen: 'true'
    - name: Build
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN_LYRICAL }}
        CURRENT_RECIPES: ros2-beluga ros-lyrical-beluga ros2-beluga-ros ros-lyrical-beluga-ros
        BUILD_TARGET: osx-64
      run: |
        export CI=github
        export GIT_BRANCH=${GITHUB_REF_NAME}
        export FEEDSTOCK_NAME=${GITHUB_REPOSITORY##*/}
        .scripts/build_unix.sh --target $BUILD_TARGET
    - name: Keep build_timings.jsonl
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: ${{ github.job }}-${{ github.run_attempt }}
        path: distros/lyrical/work/build_timings.jsonl
        if-no-files-found: ignore
        retention-days: 30
    permissions:
      id-token: write
      contents: read
      attestations: write
  stage_1_job_1:
    name: beluga-amcl
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
    needs:
    - stage_0_job_0
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Disable git auto-maintenance
      run: git config --global maintenance.auto false && git config --global gc.auto
        0
    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.11.0
      with:
        pixi-version: v0.81.0
        cache: 'true'
        log-level: v
        frozen: 'true'
    - name: Build
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN_LYRICAL }}
        CURRENT_RECIPES: ros2-beluga-amcl ros-lyrical-beluga-amcl
        BUILD_TARGET: osx-64
      run: |
        export CI=github
        export GIT_BRANCH=${GITHUB_REF_NAME}
        export FEEDSTOCK_NAME=${GITHUB_REPOSITORY##*/}
        .scripts/build_unix.sh --target $BUILD_TARGET
    - name: Keep build_timings.jsonl
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: ${{ github.job }}-${{ github.run_attempt }}
        path: distros/lyrical/work/build_timings.jsonl
        if-no-files-found: ignore
        retention-days: 30
    permissions:
      id-token: write
      contents: read
      attestations: write
name: build
run-name: lyrical osx-64
concurrency:
  group: build-lyrical-osx-64
  cancel-in-progress: true
on:
  push:
    branches:
    - buildbranch_lyrical_osx_64
env:
  ROBOSTACK_DISTRO: lyrical
  # optional repository variable: upload to this prefix.dev channel instead
  # (e.g. a test channel), or 'none' to only build
  ROBOSTACK_UPLOAD_CHANNEL: ${{ vars.ROBOSTACK_UPLOAD_CHANNEL }}
