name: build
run-name: vinca-rs trial humble win-64
on:
  push:
    branches:
    - vinca-rs-trial/humble-win-64
concurrency:
  group: vinca-rs-trial-humble-win-64
  cancel-in-progress: true
env:
  ROBOSTACK_DISTRO: humble
  ROBOSTACK_UPLOAD_CHANNEL: none  # vinca-rs trial: build only
jobs:
  job_0:
    name: apriltag
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/build-recipes
      with:
        recipes: ros2-apriltag
        platform: win-64
        token: ${{ secrets.ANACONDA_API_TOKEN_HUMBLE }}
        keep-file: distros/humble/work/build_timings.jsonl
  job_1:
