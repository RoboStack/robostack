jobs:
  stage_0_job_0:
    name: ament-package ament-cmake-core ros-workspace ros-environment
    runs-on: macos-15
    strategy:
      fail-fast: false
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Disable git auto-maintenance
      run: git config --global maintenance.auto false && git config --global gc.auto
        0
    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.11.0
      with:
        pixi-version: v0.81.0
        cache: 'true'
        log-level: v
        frozen: 'true'
    - name: Build
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN_ROLLING }}
        CURRENT_RECIPES: ros2-ament-package ros2-ament-cmake-core ros2-ros-workspace
          ros2-ros-environment
        BUILD_TARGET: osx-arm64
      run: |
        export CI=github
        export GIT_BRANCH=${GITHUB_REF_NAME}
        export FEEDSTOCK_NAME=${GITHUB_REPOSITORY##*/}
        .scripts/build_unix.sh --target $BUILD_TARGET
    - name: Keep build_timings.jsonl
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: ${{ github.job }}-${{ github.run_attempt }}
        path: distros/rolling/work/build_timings.jsonl
        if-no-files-found: ignore
        retention-days: 30
    permissions:
      id-token: write
      contents: read
      attestations: write
