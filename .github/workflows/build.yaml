# Placeholder, so that GitHub names this workflow path "build" in the Actions list.
#
# The real build.yaml lives on the buildbranch_<distro>_<platform> branches (pushed by
# main.yaml, generated by `rs <distro> gha`); every branch has its own, with
# `run-name: <distro> <platform>`. GitHub shows one workflow per path and takes its name
# from the default branch's file; without one on main it kept the name of the first
# branch that registered the path. This file is never triggered on its own.
name: build
on:
  workflow_dispatch:
jobs:
  placeholder:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "Builds run from the buildbranch_<distro>_<platform> branches' own build.yaml."
