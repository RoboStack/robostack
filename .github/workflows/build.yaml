jobs:
  stage_0_job_0:
    name: controller-interface autoware-utils-geometry interactive-markers warehouse-ros
      ros-core image-transport-plugins rmf-demos-fleet-adapter mavros rosbridge-suite
      automatika-embodied-agents
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Disable git auto-maintenance
      run: git config --global maintenance.auto false && git config --global gc.auto
        0
    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.11.0
      with:
        pixi-version: v0.81.0
        cache: 'true'
        log-level: v
        frozen: 'true'
    - name: Build
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN_LYRICAL }}
        CURRENT_RECIPES: ros2-controller-interface ros-lyrical-controller-interface
          ros2-autoware-utils-geometry ros-lyrical-autoware-utils-geometry ros2-interactive-markers
          ros-lyrical-interactive-markers ros2-warehouse-ros ros-lyrical-warehouse-ros
          ros2-ros-core ros-lyrical-ros-core ros2-image-transport-plugins ros-lyrical-image-transport-plugins
          ros2-rmf-demos-fleet-adapter ros-lyrical-rmf-demos-fleet-adapter ros2-mavros
          ros-lyrical-mavros ros2-rosbridge-suite ros-lyrical-rosbridge-suite ros2-automatika-embodied-agents
          ros-lyrical-automatika-embodied-agents
        BUILD_TARGET: osx-64
      run: |
        export CI=github
        export GIT_BRANCH=${GITHUB_REF_NAME}
        export FEEDSTOCK_NAME=${GITHUB_REPOSITORY##*/}
        .scripts/build_unix.sh --target $BUILD_TARGET
    - name: Keep build_timings.jsonl
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: ${{ github.job }}-${{ github.run_attempt }}
        path: distros/lyrical/work/build_timings.jsonl
        if-no-files-found: ignore
        retention-days: 30
    permissions:
      id-token: write
      contents: read
      attestations: write
