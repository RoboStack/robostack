# The distributions upload to prefix.dev; this keeps the old anaconda.org channels that
# users still install from up to date (tools/mirror_to_anaconda.py). Channels that are
# empty on anaconda.org (robostack-rolling, robostack-lyrical) stay empty.
#
# Only started by hand until the distributions' own prefix.dev channels are set up:
# today prefix.dev's robostack-staging and robostack-jazzy are mirrors *of* anaconda.org,
# and mirroring them back would re-upload packages that were removed there. Add a
# schedule (e.g. cron "12 * * * *") and set the source channels once they are (#54).
name: Mirror prefix.dev channels to anaconda.org

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list the packages that would be uploaded
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  mirror:
    strategy:
      fail-fast: false
      matrix:
        include:
          # humble goes to robostack-staging; copy-staging-packages.yaml copies it on to
          # robostack-humble as before
          - { source: robostack-humble, destination: robostack-staging, token: ROBOSTACK_STAGING_ANACONDA_API_TOKEN }
          - { source: robostack-jazzy, destination: robostack-jazzy, token: ROBOSTACK_JAZZY_ANACONDA_API_TOKEN }
    name: mirror ${{ matrix.source }} -> ${{ matrix.destination }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Disable git auto-maintenance
        run: git config --global maintenance.auto false && git config --global gc.auto 0
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          locked: true
          pixi-version: v0.81.0
          cache-write: false
      - name: Mirror
        env:
          ANACONDA_API_TOKEN: ${{ secrets[matrix.token] }}
          SOURCE: ${{ matrix.source }}
          DESTINATION: ${{ matrix.destination }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          if [ -z "$ANACONDA_API_TOKEN" ] && [ -z "$DRY_RUN" ]; then echo "::notice::no ${{ matrix.token }} secret: skipped"; exit 0; fi
          pixi run python tools/mirror_to_anaconda.py "$SOURCE" "$DESTINATION" $DRY_RUN
