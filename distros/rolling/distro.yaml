# Settings of ros-rolling that differ from the other distributions
# (everything else is shared, see the README).
# upload_to: where packages are uploaded, to this channel on each (prefix.dev, anaconda.org);
# read_from: where the builds look up what is already published
channel_name: robostack-rolling
upload_to: [prefix, anaconda]
read_from: prefix
# rolling has no regular sync tags; update-rosdistro-snapshot reads rosdistro master.
rosdistro_sync: manual
