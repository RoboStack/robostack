aruco_ros:  # its recipe test stops the node for sure (package tests hung on macOS)
  build_number: 33
fuse_viz:
  build_number: 33
launch:
  build_number: 35
moveit_ros_visualization:
  build_number: 33
moveit_task_constructor_visualization:
  build_number: 33
nav2_common:
  build_number: 35
orbbec_camera:
  build_number: 35
plotjuggler:
  build_number: 35
  # PlotJuggler 3.17 is Qt5-only (find_package(Qt5 ...)); the Qt rosdep keys map to Qt6 here
  remove_host: ["qt6-main"]
  remove_run: ["qt6-main"]
  add_host: ["libxcb", "${{ 'elfutils' if linux }}", "ros2-ros-workspace", "qt-main"]
  add_run: ["qt-main"]
rviz_2d_overlay_plugins:
  build_number: 33
rviz_common:
  build_number: 33
rviz_default_plugins:
  build_number: 33
rviz_imu_plugin:
  build_number: 33
rviz_ogre_vendor:
  additional_cmake_args: "-DRVIZ_OGRE_VENDOR_MANGLE_NAME_OF_LIBRARIES_USED_BY_RVIZ=ON"
  build_number: 34  # built without the EXR codec (ros2-rviz-ogre-vendor.patch), absolute install names on macOS (.osx.patch)
  add_host: ["zlib", "freeimage", "freetype", "assimp", "zziplib", "pugixml", "${{ 'libglu' if linux }}"]
  add_build: ["vcstool"]
  add_run: ["assimp"]
rviz_rendering:
  build_number: 33
rviz_satellite:
  build_number: 33
