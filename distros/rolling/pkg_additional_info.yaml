autoware_behavior_velocity_planner:
  add_host: ["cpp-expected"]
autoware_behavior_velocity_planner_common:
  add_host: ["cpp-expected"]
autoware_behavior_velocity_stop_line_module:
  add_host: ["cpp-expected"]
autoware_trajectory:
  add_host: ["fmt", "cpp-expected"]
autoware_utils_debug:
  add_host: ["fmt"]
autoware_utils_pcl:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
backward_ros:
  add_host: ["${{ 'binutils' if linux }}", "${{ 'elfutils' if linux }}", "ros2-ament-cmake-libraries"]
cartographer_ros:
  additional_cmake_args: "-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON -DCMAKE_CXX_FLAGS=-DBOOST_ZLIB_BINARY=kernel32"
  # ceres-solver pinned to cpu since RoboStack disables CUDA.
  add_host: ["cartographer 2.*", "libboost-devel", "ceres-solver * cpu*", "ros2-pcl-conversions"]
  add_run: ["ros2-pcl-conversions"]
console_bridge_vendor:
  add_host: ["console_bridge"]
  add_run: ["console_bridge"]
depth_image_proc:
  add_host: ["eigen-abi-devel"]
eigenpy:
  generate_dummy_package_with_run_deps:
    dep_name: eigenpy
    max_pin: 'x.x.x'
  add_host: ["eigen-abi-devel"]
foxglove_bridge:
  add_host: ["ros2-ament-cmake"]
geometric_shapes:
  add_host: ["libboost-devel", "octomap"]
gtsam:
  generate_dummy_package_with_run_deps:
    dep_name: gtsam
    max_pin: 'x.x'
    # the version on ros is actually an alpha, not a properly released version,
    # see https://discourse.ros.org/t/on-new-gtsam-version-without-boost/44307
    override_version: '4.2.0'
gz_cmake_vendor:
  # Every gz-*/sdformat vendor pins the majors of one Gazebo release, so that no solve mixes releases
  # (unpinned, a solve can fall back to an older release whose builds go with other abseil/protobuf).
  # rolling's vendors already target the next Gazebo (prereleases, e.g. gz-sim 11), which conda-forge
  # does not ship yet: build against Jetty, as lyrical does, and move once conda-forge has it.
  add_host: ["gz-cmake 5.*"]
  add_run: ["gz-cmake 5.*"]
gz_common_vendor:
  add_host: ["gz-common 7.*"]
  add_run: ["gz-common 7.*"]
gz_dartsim_vendor:
  add_host: ["dartsim-cpp", "eigen-abi-devel"]
  add_run: ["dartsim-cpp"]
gz_fuel_tools_vendor:
  add_host: ["gz-fuel-tools 11.*"]
  add_run: ["gz-fuel-tools 11.*"]
gz_gui_vendor:
  add_host: ["gz-gui 10.*"]
  add_run: ["gz-gui 10.*"]
gz_math_vendor:
  add_host: ["gz-math 9.*"]
  add_run: ["gz-math 9.*"]
gz_msgs_vendor:
  add_host: ["gz-msgs 12.*"]
  add_run: ["gz-msgs 12.*"]
gz_ogre_next_vendor:
  add_host: ["ogre-next"]
  add_run: ["ogre-next"]
  remove_host: ["shaderc"]
  remove_run: ["shaderc"]
gz_physics_vendor:
  add_host: ["gz-physics 9.*"]
  add_run: ["gz-physics 9.*"]
gz_plugin_vendor:
  add_host: ["gz-plugin 4.*"]
  add_run: ["gz-plugin 4.*"]
gz_rendering_vendor:
  add_host: ["gz-rendering 10.*", "swig"]
  add_run: ["gz-rendering 10.*", "swig"]
gz_ros2_control:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "ros2-gz-sensors-vendor"]
gz_ros2_control_demos:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
gz_sensors_vendor:
  add_host: ["gz-sensors 10.*"]
  add_run: ["gz-sensors 10.*"]
gz_sim_vendor:
  add_host: ["libgz-sim 10.*"]
  add_run: ["libgz-sim 10.*"]
gz_tools_vendor:
  add_host: ["gz-tools 2.*"]
  add_run: ["gz-tools 2.*"]
gz_transport_vendor:
  add_host: ["libgz-transport 15.*"]
  add_run: ["libgz-transport 15.*"]
gz_utils_vendor:
  add_host: ["gz-utils 4.*"]
  add_run: ["gz-utils 4.*"]
iceoryx_binding_c:
  generate_dummy_package_with_run_deps:
    dep_name: libiceoryx-binding-c
    max_pin: 'x.x.x'
    # the version on ROS (2.0.6) is outdated w.r.t. the conda-forge one
    override_version: '2.95.8'
iceoryx_hoofs:
  generate_dummy_package_with_run_deps:
    dep_name: libiceoryx-hoofs
    max_pin: 'x.x.x'
    # the version on ROS (2.0.6) is outdated w.r.t. the conda-forge one
    override_version: '2.95.8'
iceoryx_posh:
  generate_dummy_package_with_run_deps:
    dep_name: libiceoryx-posh
    max_pin: 'x.x.x'
    # the version on ROS (2.0.6) is outdated w.r.t. the conda-forge one
    override_version: '2.95.8'
image_view:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
  # Depends on opencv with gui support, see  https://github.com/ros-perception/image_pipeline/blob/746268fcfd21b389bc39ae60bb6345a53c838558/image_view/src/stereo_view_node.cpp#L253
  add_run: ["${{ 'libopencv * *qt6*' if not (ppc64le or aarch64 or osx) }}"]
intra_process_demo:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
  # Depends on opencv with gui support, see https://github.com/ros2/demos/blob/8f361a1ece2daae54016959f3ea9ab2e7692ddbb/intra_process_demo/include/image_pipeline/image_view_node.hpp#L58
  add_run: ["${{ 'libopencv * *qt6*' if not (ppc64le or aarch64 or osx) }}"]
libcamera:
  generate_dummy_package_with_run_deps:
    dep_name: libcamera
    # see https://git.libcamera.org/libcamera/libcamera.git/tree/meson.build?h=v0.5.1#n65
    max_pin: 'x.x'
    override_version: '0.5.2'
libg2o:
  additional_cmake_args: "-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON"
  add_host: ["${{ 'libglu' if linux }}", "${{ 'freeglut' if not osx }}"]
librealsense2:
  generate_dummy_package_with_run_deps:
    dep_name: librealsense
    max_pin: 'x.x'
    override_version: 2.58.3  # Until: https://github.com/conda-forge/librealsense-feedstock/pull/91
magic_enum:
  generate_dummy_package_with_run_deps:
    dep_name: magic_enum
    max_pin: 'x.x'
mimick_vendor:
  add_build: ["vcstool"]
moveit_core:
  add_host: ["eigen-abi-devel"]
moveit_visual_tools:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "libboost-devel"]
ompl:
  generate_dummy_package_with_run_deps:
    dep_name: ompl
    max_pin: 'x.x'
opennav_coverage:
  # package.xml misses deps that CMakeLists.txt finds
  add_host: [ros2-rclcpp-components, ros2-std-msgs, ros2-visualization-msgs]
  add_run: [ros2-rclcpp-components, ros2-std-msgs, ros2-visualization-msgs]
pcl_conversions:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "libboost-devel", "eigen-abi-devel"]
pinocchio:
  add_host: ["eigen-abi-devel"]
plotjuggler_ros:
  # Qt5-only like plotjuggler, which it links
  remove_host: ["qt6-main"]
  remove_run: ["qt6-main"]
  add_host: ["qt-main"]
  add_run: ["qt-main"]
proxsuite:
  generate_dummy_package_with_run_deps:
    dep_name: proxsuite
    max_pin: 'x.x'
    override_version: '0.7.3'
py_trees:
  add_host: ["hatchling"]
py_trees_js:
  add_host: ["hatchling"]  # 0.7 builds with hatchling (as in humble/jazzy)
py_trees_ros:
  add_host: ["poetry-core"]
py_trees_ros_tutorials:
  # the mock GUI is ported to PyQt6 (patch/ros2-py-trees-ros-tutorials.patch)
  add_run: ["pyqt6"]
py_trees_ros_viewer:
  add_host: ["poetry-core"]
python_qt_binding:
  # sip <6.16: conda_build_config's variant pin doesn't apply transitively here; 6.16.x regressed ABI targeting for PyQt-based bindings.
  add_host: ["pyqt-builder", "qt6-main", "pyqt6", "sip <6.16"]
  add_run: ["pyqt-builder", "qt6-main", "pyqt6"]
qt_gui_cpp:
  # sip pinned directly for the same reason as python_qt_binding above.
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "pyqt-builder", "qt6-main", "pyqt6", "sip <6.16"]
  add_run: ["pyqt-builder", "qt6-main", "pyqt6"]
rclpy:
  add_host: ["typing_extensions"]
  add_run: ["typing_extensions"]
rmf_fleet_adapter_python:
  add_host: ["pybind11_json"]
rmf_visualization_schedule:
  # asio isn't declared in package.xml; websocketpp's own headers need it directly (websocketpp/common/asio.hpp).
  add_host: ["asio"]
  add_run: ["asio"]
rmf_websocket:
  # asio isn't declared in package.xml; websocketpp's own headers need it directly (websocketpp/common/asio.hpp).
  add_host: ["asio"]
  add_run: ["asio"]
roboplan_example_models:
  # src/resources.cpp uses dladdr() from dlfcn.h, which is POSIX-only.
  # On Windows we need to depend on dlfcn-win32 instead.
  add_host: ["${{ 'dlfcn-win32' if win }}"]
roboplan_ros_examples:
  add_host: ["ros2-ament-cmake"]
ros_gz_sim:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "ros2-gz-sensors-vendor"]
rqt_gui_cpp:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
rtabmap:
  additional_cmake_args: -DBUILD_TESTING=OFF
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "ceres-solver", "${{ 'libdc1394' if not win }}", "libusb", "vtk"]
sdformat_urdf:
  add_host: ["sdformat 16.*"]
  add_run: ["sdformat 16.*"]
sdformat_vendor:
  add_host: ["sdformat 16.*"]
  add_run: ["sdformat 16.*"]
spdlog_vendor:
  add_host: ["spdlog"]
  add_run: ["spdlog"]
tf2_eigen_kdl:
  add_host: ["eigen-abi-devel"]
uncrustify_vendor:
  add_host: ["uncrustify"]
  add_run: ["uncrustify"]
ur_moveit_config:
  add_host: ["ros2-rclpy"]
  add_run: ["ros2-rclpy"]
urdfdom:
  generate_dummy_package_with_run_deps:
    dep_name: urdfdom
    max_pin: 'x.x'
    # the version on ros is outdated w.r.t. to the conda-forge one
    override_version: '6.0.0'
urdfdom_headers:
  generate_dummy_package_with_run_deps:
    dep_name: urdfdom_headers
    max_pin: 'x.x'
    # the version on ros is outdated w.r.t. to the conda-forge one
    override_version: '3.0.0'
vision_msgs_rviz_plugins:
  add_build: ["${{ 'qt6-main' if (build_platform != target_platform) }}"]
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
yasmin_pcl:
  add_host: ["ros2-pcl-conversions"]
  add_run: ["ros2-pcl-conversions"]
zenoh_cpp_vendor:
