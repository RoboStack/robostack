cartographer_ros:
  additional_cmake_args: "-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON -DCMAKE_CXX_FLAGS=-DBOOST_ZLIB_BINARY=kernel32"
eigenpy:
  generate_dummy_package_with_run_deps:
    dep_name: eigenpy
    max_pin: 'x.x.x'
gtsam:
  generate_dummy_package_with_run_deps:
    dep_name: gtsam
    max_pin: 'x.x'
    # the version on ros is actually an alpha, not a properly released version,
    # see https://discourse.ros.org/t/on-new-gtsam-version-without-boost/44307
    override_version: '4.2.0'
iceoryx_binding_c:
  generate_dummy_package_with_run_deps:
    dep_name: libiceoryx-binding-c
    max_pin: 'x.x.x'
    # the version on ROS (2.0.6) is outdated w.r.t. the conda-forge one
    override_version: '2.95.8'
iceoryx_hoofs:
  generate_dummy_package_with_run_deps:
    dep_name: libiceoryx-hoofs
    max_pin: 'x.x.x'
    # the version on ROS (2.0.6) is outdated w.r.t. the conda-forge one
    override_version: '2.95.8'
iceoryx_posh:
  generate_dummy_package_with_run_deps:
    dep_name: libiceoryx-posh
    max_pin: 'x.x.x'
    # the version on ROS (2.0.6) is outdated w.r.t. the conda-forge one
    override_version: '2.95.8'
libcamera:
  generate_dummy_package_with_run_deps:
    dep_name: libcamera
    # see https://git.libcamera.org/libcamera/libcamera.git/tree/meson.build?h=v0.5.1#n65
    max_pin: 'x.x'
    override_version: '0.5.2'
libg2o:
  additional_cmake_args: "-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON"
librealsense2:
  generate_dummy_package_with_run_deps:
    dep_name: librealsense
    max_pin: 'x.x'
    override_version: 2.58.3  # Until: https://github.com/conda-forge/librealsense-feedstock/pull/91
magic_enum:
  generate_dummy_package_with_run_deps:
    dep_name: magic_enum
    max_pin: 'x.x'
ompl:
  generate_dummy_package_with_run_deps:
    dep_name: ompl
    max_pin: 'x.x'
proxsuite:
  generate_dummy_package_with_run_deps:
    dep_name: proxsuite
    max_pin: 'x.x'
    override_version: '0.7.3'
rtabmap:
  additional_cmake_args: -DBUILD_TESTING=OFF
urdfdom:
  generate_dummy_package_with_run_deps:
    dep_name: urdfdom
    max_pin: 'x.x'
    # the version on ros is outdated w.r.t. to the conda-forge one
    override_version: '6.0.0'
urdfdom_headers:
  generate_dummy_package_with_run_deps:
    dep_name: urdfdom_headers
    max_pin: 'x.x'
    # the version on ros is outdated w.r.t. to the conda-forge one
    override_version: '3.0.0'
zenoh_cpp_vendor:
  additional_cmake_args: "-DAMENT_VENDOR_POLICY=NEVER_VENDOR_IGNORE_SATISFIED_CHECK -DUSE_SYSTEM_ZENOH=ON"
rosidl_generator_c:
  build_number: 34
rosidl_generator_cpp:
  build_number: 34
rosidl_generator_py:
  build_number: 34
rosidl_generator_type_description:
  build_number: 34
rosidl_typesupport_introspection_c:
  build_number: 34
rosidl_typesupport_introspection_cpp:
  build_number: 34
rviz_ogre_vendor:
  additional_cmake_args: "-DRVIZ_OGRE_VENDOR_MANGLE_NAME_OF_LIBRARIES_USED_BY_RVIZ=ON"
  build_number: 33  # built without the EXR codec (ros2-rviz-ogre-vendor.patch)
