# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-netft-driver
  version: 0.4.0
source:
  git: https://github.com/netft/ros-netft.git
  tag: 0.4.0
  target_directory: ros2-netft-driver/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 32
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://github.com/netft/ros-netft
  repository: https://github.com/netft/ros-netft
  license: Apache-2.0
  summary: Native ROS 1, ROS 2, and ros2_control driver for ATI Net F/T RDT sensors.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - gtest
    - libcurl
    - numpy
    - pip
    - pytest
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-gtest
    - ros2-ament-cmake-pytest
    - ros2-controller-manager
    - ros2-diagnostic-msgs
    - ros2-distro-mutex 0.23.* rolling_*
    - ros2-geometry-msgs
    - ros2-hardware-interface
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-rclpy
    - ros2-realtime-tools
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-ros2controlcli
    - ros2-std-srvs
  run:
    - libcurl
    - python
    - ros2-ament-index-python
    - ros2-controller-manager
    - ros2-diagnostic-msgs
    - ros2-distro-mutex 0.23.* rolling_*
    - ros2-force-torque-sensor-broadcaster
    - ros2-geometry-msgs
    - ros2-hardware-interface
    - ros2-launch
    - ros2-launch-ros
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-realtime-tools
    - ros2-robot-state-publisher
    - ros2-ros-workspace
    - ros2-std-srvs
    - ros2-xacro
