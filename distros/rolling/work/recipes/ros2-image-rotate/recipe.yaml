# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-image-rotate
  version: 8.0.1
source:
  git: https://github.com/ros2-gbp/image_pipeline-release.git
  tag: release/rolling/image_rotate/8.0.1-1
  target_directory: ros2-image-rotate/src/work
  patches:
    - patch/ros2-image-rotate.patch
    - patch/ros2-image-rotate.win.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 32
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://index.ros.org/p/image_rotate/
  repository: https://github.com/ros-perception/image_pipeline
  license: BSD-3-Clause
  summary: "<p>\n      Contains a node that rotates an image stream in a way that minimizes\n      the angle between a vector in some arbitrary frame and a vector in the\n      camera frame. The frame of the outgoing image is published by the node.\n    </p>\n    <p>\n      This node is intended to allow camera images to be visualized in an\n      orientation that is more intuitive than the hardware-constrained\n      orientation of the physical camera. This is particularly helpful, for\n      example, to show images from the PR2's forearm cameras with a\n      consistent up direction, despite the fact that the forearms need to\n      rotate in arbitrary ways during manipulation.\n    </p>\n    <p>\n      It is not recommended to use the output from this node for further\n      computation, as it interpolates the source image, introduces black\n      borders, and does not output a camera_info.\n    </p>"
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - libopencv
    - numpy
    - pip
    - py-opencv
    - python
    - ros2-ament-cmake-auto
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-class-loader
    - ros2-cv-bridge
    - ros2-distro-mutex 0.23.* rolling_*
    - ros2-geometry-msgs
    - ros2-image-transport
    - ros2-rcl-interfaces
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-sensor-msgs
    - ros2-tf2
    - ros2-tf2-geometry-msgs
    - ros2-tf2-ros
  run:
    - libopencv
    - py-opencv
    - python
    - ros2-cv-bridge
    - ros2-distro-mutex 0.23.* rolling_*
    - ros2-geometry-msgs
    - ros2-image-transport
    - ros2-rcl-interfaces
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-ros-workspace
    - ros2-sensor-msgs
    - ros2-tf2
    - ros2-tf2-geometry-msgs
    - ros2-tf2-ros
