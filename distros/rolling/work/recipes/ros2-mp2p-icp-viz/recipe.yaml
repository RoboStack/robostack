# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-mp2p-icp-viz
  version: 3.0.2
source:
  git: https://github.com/ros2-gbp/mp2p_icp-release.git
  tag: release/rolling/mp2p_icp_viz/3.0.2-1
  target_directory: ros2-mp2p-icp-viz/src/work
  patches:
    - patch/ros2-mp2p-icp-viz.patch

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 32
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://github.com/MOLAorg/mp2p_icp
  repository: https://github.com/MOLAorg/mp2p_icp
  license: BSD-3-Clause
  summary: "GUI applications for mp2p_icp: mm-viewer (interactive *.mm map viewer) and icp-log-viewer (ICP log inspector). Kept in a separate package from mp2p_icp_core so headless consumers don't need to pull in mrpt_gui."
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - cli11
    - glfw 3.*
    - numpy
    - pip
    - python
    - ros2-distro-mutex 0.23.* rolling_*
    - ros2-mola-common
    - ros2-mp2p-icp-core
    - ros2-mrpt-gui
    - ros2-mrpt-imgui
    - ros2-mrpt-imgui-vendor
    - ros2-mrpt-opengl
    - ros2-ros-environment
    - ros2-ros-workspace
  run:
    - cli11
    - glfw
    - python
    - ros2-distro-mutex 0.23.* rolling_*
    - ros2-mola-common
    - ros2-mp2p-icp-core
    - ros2-mrpt-gui
    - ros2-mrpt-imgui
    - ros2-mrpt-imgui-vendor
    - ros2-mrpt-opengl
    - ros2-ros-workspace
