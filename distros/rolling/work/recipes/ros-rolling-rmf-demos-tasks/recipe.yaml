# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-rolling-rmf-demos-tasks
  version: 2.8.2

build:
  script: ''
  number: 32
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  summary: Compatibility package for ros2-rmf-demos-tasks
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  run:
    - ros2-rmf-demos-tasks ==2.8.2
    - ros2-distro-mutex 0.23.* rolling_*
