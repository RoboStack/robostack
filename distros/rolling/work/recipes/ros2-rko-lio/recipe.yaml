# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-rko-lio
  version: 0.4.2
source:
  git: https://github.com/ros2-gbp/rko_lio-release.git
  tag: release/rolling/rko_lio/0.4.2-1
  target_directory: ros2-rko-lio/src/work
  patches:
    - patch/ros2-rko-lio.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 32
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/PRBonn/rko_lio
  license: MIT
  summary: A Robust Approach for LiDAR-Inertial Odometry Without Sensor-Specific Modelling
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - eigen
    - eigen-abi-devel
    - fmt
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-distro-mutex 0.23.* rolling_*
    - ros2-geometry-msgs
    - ros2-nav-msgs
    - ros2-point-cloud-interfaces
    - ros2-point-cloud-transport
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rosbag2-cpp
    - ros2-rosbag2-storage
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-tf2
    - ros2-tf2-ros
    - sophus
    - spdlog
    - tbb
    - tbb-devel
    - tsl_robin_map
  run:
    - eigen
    - eigen-abi-devel
    - fmt
    - python
    - ros2-distro-mutex 0.23.* rolling_*
    - ros2-geometry-msgs
    - ros2-nav-msgs
    - ros2-point-cloud-interfaces
    - ros2-point-cloud-transport
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-rclpy
    - ros2-ros-workspace
    - ros2-rosbag2-cpp
    - ros2-rosbag2-py
    - ros2-rosbag2-storage
    - ros2-rosidl-runtime-py
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-tf2
    - ros2-tf2-ros
    - ros2-tf2-ros-py
    - sophus
    - spdlog
    - tbb
    - tbb-devel
    - tsl_robin_map
tests:
  - if: unix
    then:
      script:
        - python -c "import os, subprocess, sys, time; p = subprocess.Popen([os.path.join(os.environ['PREFIX'], 'lib', 'rko_lio', 'online_node'), '--ros-args', '-p', 'imu_topic:=/imu', '-p', 'lidar_topic:=/lidar', '-p', 'base_frame:=base_link']); time.sleep(5); r = p.poll(); p.terminate(); time.sleep(3); p.kill(); p.wait(); sys.exit(0 if r is None else 1)"
