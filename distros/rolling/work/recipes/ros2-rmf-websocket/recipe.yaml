# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-rmf-websocket
  version: 2.12.0
source:
  git: https://github.com/ros2-gbp/rmf_ros2-release.git
  tag: release/rolling/rmf_websocket/2.12.0-2
  target_directory: ros2-rmf-websocket/src/work
  patches:
    - patch/ros2-rmf-websocket.patch
    - patch/ros2-rmf-websocket.win.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 32
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/open-rmf/rmf_ros2
  license: Apache-2.0
  summary: A package managing the websocket api endpoints in RMF system.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - asio
    - if: build_platform == target_platform
      then:
        - pkg-config
    - eigen
    - eigen-abi-devel
    - libboost-devel
    - libboost-python-devel
    - nlohmann_json
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-catch2
    - ros2-ament-cmake-uncrustify
    - ros2-distro-mutex 0.23.* rolling_*
    - ros2-nlohmann-json-schema-validator-vendor
    - ros2-rclcpp
    - ros2-rmf-utils
    - ros2-ros-environment
    - ros2-ros-workspace
    - websocketpp
  run:
    - asio
    - libboost-devel
    - libboost-python-devel
    - nlohmann_json
    - python
    - ros2-distro-mutex 0.23.* rolling_*
    - ros2-nlohmann-json-schema-validator-vendor
    - ros2-rclcpp
    - ros2-rmf-utils
    - ros2-ros-workspace
    - websocketpp
