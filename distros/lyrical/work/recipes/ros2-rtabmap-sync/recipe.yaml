# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-rtabmap-sync
  version: 0.23.13
source:
  git: https://github.com/introlab/rtabmap_ros-release.git
  tag: release/lyrical/rtabmap_sync/0.23.13-1
  target_directory: ros2-rtabmap-sync/src/work
  patches:
    - patch/ros2-rtabmap-sync.win.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 30
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/introlab/rtabmap_ros
  license: BSD-3-Clause
  summary: RTAB-Map's synchronization package.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-ament-cmake-gtest
    - ros2-ament-cmake-ros
    - ros2-cv-bridge
    - ros2-diagnostic-updater
    - ros2-distro-mutex 0.22.* lyrical_*
    - ros2-image-transport
    - ros2-message-filters
    - ros2-nav-msgs
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rtabmap-conversions
    - ros2-rtabmap-msgs
    - ros2-sensor-msgs
  run:
    - python
    - ros2-cv-bridge
    - ros2-diagnostic-updater
    - ros2-distro-mutex 0.22.* lyrical_*
    - ros2-image-transport
    - ros2-message-filters
    - ros2-nav-msgs
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-ros-workspace
    - ros2-rtabmap-conversions
    - ros2-rtabmap-msgs
    - ros2-sensor-msgs
