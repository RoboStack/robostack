# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-pymoveit2
  version: 5.0.0
source:
  git: https://github.com/ros2-gbp/pymoveit2-release.git
  tag: release/lyrical/pymoveit2/5.0.0-1
  target_directory: ros2-pymoveit2/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 30
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/AndrejOrsula/pymoveit2
  license: BSD-3-Clause
  summary: Basic Python interface for MoveIt 2 built on top of ROS 2 actions and services
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - pytest
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-pytest
    - ros2-ament-cmake-python
    - ros2-distro-mutex 0.22.* lyrical_*
    - ros2-ros-environment
    - ros2-ros-workspace
  run:
    - numpy
    - python
    - ros2-action-msgs
    - ros2-control-msgs
    - ros2-distro-mutex 0.22.* lyrical_*
    - ros2-geometry-msgs
    - ros2-moveit-msgs
    - ros2-rcl-interfaces
    - ros2-rclpy
    - ros2-ros-workspace
    - ros2-sensor-msgs
    - ros2-shape-msgs
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-trajectory-msgs
tests:
  - python:
      imports:
        - pymoveit2
        - pymoveit2.robots.panda
      pip_check: false
  - script:
      env:
        ROS_LOCALHOST_ONLY: '1'
        ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      content:
        - python pymoveit2_smoke_test.py
    files:
      recipe:
        - pymoveit2_smoke_test.py
