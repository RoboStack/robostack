# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-rtabmap-slam
  version: 0.23.13
source:
  git: https://github.com/introlab/rtabmap_ros-release.git
  tag: release/lyrical/rtabmap_slam/0.23.13-1
  target_directory: ros2-rtabmap-slam/src/work
  patches:
    - patch/ros2-rtabmap-slam.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 30
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/introlab/rtabmap_ros
  license: BSD-3-Clause
  summary: RTAB-Map's SLAM package.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-ament-cmake-gtest
    - ros2-ament-cmake-ros
    - ros2-apriltag-msgs
    - ros2-aruco-msgs
    - ros2-aruco-opencv-msgs
    - ros2-cv-bridge
    - ros2-distro-mutex 0.22.* lyrical_*
    - ros2-geometry-msgs
    - ros2-nav-msgs
    - ros2-nav2-msgs
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rtabmap-conversions
    - ros2-rtabmap-msgs
    - ros2-rtabmap-sync
    - ros2-rtabmap-util
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-tf2
    - ros2-tf2-ros
    - ros2-visualization-msgs
  run:
    - python
    - ros2-apriltag-msgs
    - ros2-aruco-msgs
    - ros2-aruco-opencv-msgs
    - ros2-cv-bridge
    - ros2-distro-mutex 0.22.* lyrical_*
    - ros2-geometry-msgs
    - ros2-nav-msgs
    - ros2-nav2-msgs
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-ros-workspace
    - ros2-rtabmap-msgs
    - ros2-rtabmap-sync
    - ros2-rtabmap-util
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-tf2
    - ros2-tf2-ros
    - ros2-visualization-msgs
tests:
  - if: unix
    then:
      script:
        - python -c "import os, subprocess, sys, time; p = subprocess.Popen([os.path.join(os.environ['PREFIX'], 'lib', 'rtabmap_slam', 'rtabmap')]); time.sleep(5); r = p.poll(); p.terminate(); sys.exit(0 if r is None else 1)"
  - if: win
    then:
      script:
        - if not exist %LIBRARY_LIB%\rtabmap_slam\rtabmap.exe exit 1
