# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-beluga
  version: 2.1.1
source:
  git: https://github.com/ros2-gbp/beluga-release.git
  tag: release/jazzy/beluga/2.1.1-1
  target_directory: ros2-beluga/src/work
  patches:
    - patch/ros2-beluga.patch
    - patch/ros2-beluga.osx.patch

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 30
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  license: Apache-2.0
  summary: A generic MCL library for ROS2.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - benchmark
    - if: build_platform == target_platform
      then:
        - pkg-config
    - clang-format
    - clang-tools
    - eigen
    - eigen-abi-devel
    - gmock
    - gtest
    - hdf5
    - numpy
    - pip
    - python
    - range-v3
    - ros2-distro-mutex 0.22.* lyrical_*
    - ros2-ros-environment
    - ros2-ros-workspace
    - sophus
    - tbb
    - tbb-devel
  run:
    - eigen
    - eigen-abi-devel
    - hdf5
    - python
    - range-v3
    - ros2-distro-mutex 0.22.* lyrical_*
    - ros2-ros-workspace
    - sophus
    - tbb
    - tbb-devel
