# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-spatio-temporal-voxel-layer
  version: 2.7.0
source:
  git: https://github.com/SteveMacenski/spatio_temporal_voxel_layer-release.git
  tag: release/lyrical/spatio_temporal_voxel_layer/2.7.0-1
  target_directory: ros2-spatio-temporal-voxel-layer/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 31
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/SteveMacenski/spatio_temporal_voxel_layer
  license: LGPL-2.1-or-later
  summary: The spatio-temporal 3D obstacle costmap package
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
    - if: target_platform == 'emscripten-wasm32'
      then:
        - ros2-rosidl-default-generators
  host:
    - ${{ 'libgl-devel' if linux }}
    - ${{ 'libopengl-devel' if linux }}
    - if: build_platform == target_platform
      then:
        - pkg-config
    - eigen-abi-devel
    - libboost-devel
    - libgl-devel
    - libopengl-devel
    - numpy
    - openexr
    - openvdb
    - pcl
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-lint-auto
    - ros2-builtin-interfaces
    - ros2-distro-mutex 0.22.* lyrical_*
    - ros2-geometry-msgs
    - ros2-laser-geometry
    - ros2-message-filters
    - ros2-nav2-costmap-2d
    - ros2-nav2-ros-common
    - ros2-openvdb-vendor
    - ros2-pcl-conversions
    - ros2-pluginlib
    - ros2-point-cloud-transport
    - ros2-point-cloud-transport-plugins
    - ros2-rclcpp
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rosidl-default-generators
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-tf2-geometry-msgs
    - ros2-tf2-ros
    - ros2-tf2-sensor-msgs
    - ros2-visualization-msgs
    - vtk-base
  run:
    - eigen-abi-devel
    - libboost-devel
    - libgl-devel
    - libopengl-devel
    - openexr
    - pcl
    - python
    - ros2-builtin-interfaces
    - ros2-distro-mutex 0.22.* lyrical_*
    - ros2-geometry-msgs
    - ros2-laser-geometry
    - ros2-message-filters
    - ros2-nav2-costmap-2d
    - ros2-nav2-ros-common
    - ros2-openvdb-vendor
    - ros2-pcl-conversions
    - ros2-pluginlib
    - ros2-point-cloud-transport
    - ros2-point-cloud-transport-plugins
    - ros2-rclcpp
    - ros2-ros-workspace
    - ros2-rosidl-default-runtime
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-tf2-geometry-msgs
    - ros2-tf2-ros
    - ros2-tf2-sensor-msgs
    - ros2-visualization-msgs
    - vtk-base
tests:
  - script:
      - python -c "import ctypes, os; ctypes.CDLL(os.path.join(os.environ['PREFIX'], 'lib', 'libspatio_temporal_voxel_layer_core.so'))"
    requirements:
      run:
        - python
