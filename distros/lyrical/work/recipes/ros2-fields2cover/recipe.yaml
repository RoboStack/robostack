# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-fields2cover
  version: 2.1.1
source:
  git: https://github.com/ros2-gbp/fields2cover-release.git
  tag: release/lyrical/fields2cover/2.1.1-1
  target_directory: ros2-fields2cover/src/work
  patches:
    - patch/ros2-fields2cover.patch

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 30
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/Fields2Cover/fields2cover
  license: BSD-3-Clause
  summary: Robust and efficient coverage paths for autonomous agricultural vehicles. A modular and extensible Coverage Path Planning library
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
    - if: build_platform != target_platform
      then:
        - git
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - eigen
    - eigen-abi-devel
    - geos
    - gtest
    - lcov
    - libboost-devel
    - libboost-python-devel
    - libgdal-core
    - numpy
    - pip
    - python
    - ros2-distro-mutex 0.22.* lyrical_*
    - ros2-ortools-vendor
    - ros2-ros-environment
    - ros2-ros-workspace
    - swig
    - tbb
    - tbb-devel
    - tinyxml2
    - if: build_platform == target_platform
      then:
        - git
  run:
    - eigen
    - eigen-abi-devel
    - geos
    - git
    - gtest
    - libboost-devel
    - libboost-python-devel
    - libgdal-core
    - matplotlib-base
    - python
    - ros2-distro-mutex 0.22.* lyrical_*
    - ros2-ortools-vendor
    - ros2-ros-workspace
    - swig
    - tbb
    - tbb-devel
    - tinyxml2
    - tk
