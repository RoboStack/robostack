autoware_behavior_velocity_planner_common:
  add_host: ["cpp-expected"]
autoware_behavior_velocity_stop_line_module:
  add_host: ["cpp-expected"]
autoware_trajectory:
  add_host: ["fmt", "cpp-expected"]
autoware_utils_debug:
  add_host: ["fmt"]
autoware_utils_pcl:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
backward_ros:
  add_host: ["${{ 'binutils' if linux }}", "${{ 'elfutils' if linux }}", "ros2-ament-cmake-libraries"]
cartographer_ros:
  additional_cmake_args: "-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON -DCMAKE_CXX_FLAGS=-DBOOST_ZLIB_BINARY=kernel32"
  add_host: ["cartographer 2.*", "libboost-devel", "ceres-solver"]
console_bridge_vendor:
  add_host: ["console_bridge"]
  add_run: ["console_bridge"]
depth_image_proc:
  add_host: ["eigen-abi-devel"]
eigenpy:
  generate_dummy_package_with_run_deps:
    dep_name: eigenpy
    max_pin: 'x.x.x'
  add_host: ["eigen-abi-devel"]
foxglove_bridge:
  add_host: ["ros2-ament-cmake"]
geometric_shapes:
  add_host: ["libboost-devel", "octomap"]
gtsam:
  generate_dummy_package_with_run_deps:
    dep_name: gtsam
    max_pin: 'x.x'
    # the version on ros is actually an alpha, not a properly released version,
    # see https://discourse.ros.org/t/on-new-gtsam-version-without-boost/44307
    override_version: '4.2.0'
gz_cmake_vendor:
  # https://github.com/gazebo-release/gz_cmake_vendor/blob/lyrical/CMakeLists.txt#L6 for select the right major version
  # (this is true for all gz-* vendor packages) or https://github.com/gazebo-tooling/gazebodistro/blob/master/collection-harmonic.yaml
  # See https://gazebosim.org/docs/latest/ros_installation/#summary-of-compatible-ros-and-gazebo-combinations for mapping between ROS2 and Gazebo distros
  # Every gz-*/sdformat vendor pins the majors of Jetty, so that no solve mixes releases: unpinned, an
  # osx-arm64 py312 solve took gz-transport 14 (Ionic), whose builds go with a newer libabseil than Jetty's.
  add_host: ["gz-cmake 5.*"]
  add_run: ["gz-cmake 5.*"]
gz_common_vendor:
  add_host: ["gz-common 7.*"]
  add_run: ["gz-common 7.*"]
gz_dartsim_vendor:
  add_host: ["dartsim-cpp", "eigen-abi-devel"]
  add_run: ["dartsim-cpp"]
gz_fuel_tools_vendor:
  add_host: ["gz-fuel-tools 11.*"]
  add_run: ["gz-fuel-tools 11.*"]
gz_launch_vendor:
  add_host: ["gz-launch 9.*"]
  add_run: ["gz-launch 9.*"]
gz_math_vendor:
  add_host: ["gz-math 9.*"]
  add_run: ["gz-math 9.*"]
gz_msgs_vendor:
  add_host: ["gz-msgs 12.*"]
  add_run: ["gz-msgs 12.*"]
gz_ogre_next_vendor:
  add_host: ["ogre-next"]
  add_run: ["ogre-next"]
  remove_host: ["shaderc"]
  remove_run: ["shaderc"]
gz_physics_vendor:
  add_host: ["gz-physics 9.*"]
  add_run: ["gz-physics 9.*"]
gz_plugin_vendor:
  add_host: ["gz-plugin 4.*"]
  add_run: ["gz-plugin 4.*"]
gz_rendering_vendor:
  add_host: ["gz-rendering 10.*", "swig"]
  add_run: ["gz-rendering 10.*", "swig"]
gz_ros2_control:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "ros2-gz-sensors-vendor"]
gz_ros2_control_demos:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
gz_tools_vendor:
  add_host: ["gz-tools 2.*"]
  add_run: ["gz-tools 2.*"]
gz_utils_vendor:
  add_host: ["gz-utils 4.*"]
  add_run: ["gz-utils 4.*"]
iceoryx_binding_c:
  generate_dummy_package_with_run_deps:
    dep_name: libiceoryx-binding-c
    max_pin: 'x.x.x'
    # the version on ROS (2.0.6) is outdated w.r.t. the conda-forge one
    override_version: '2.95.8'
iceoryx_hoofs:
  generate_dummy_package_with_run_deps:
    dep_name: libiceoryx-hoofs
    max_pin: 'x.x.x'
    # the version on ROS (2.0.6) is outdated w.r.t. the conda-forge one
