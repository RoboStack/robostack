# noetic: its own rosdep mappings, over shared/robostack.yaml (Qt 6 like the other
# distributions). Also synced into pixi-build-ros (robostack-bot sync-pixi-mappings).
xtensor:
  robostack: [xtensor ==0.24.7]
libopenvdb:
  robostack: [openvdb]
# QtWebEngine for Qt 6 (rqt_web, RoboStack/ros-noetic#509); shared/ still has Qt 5's
python3-qt5-bindings-webkit:
  robostack: [pyqt6-webengine]
