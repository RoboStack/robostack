# ROS 1: noetic doesn't extend shared/vinca.yaml (its package selection, mutex and
# per-package settings are ROS 2's); it shares the rosdep mappings and the pinning.
ros_distro: noetic
patch_dir: patch
rosdistro_snapshot: rosdistro_snapshot.yaml
rosdistro_additional_recipes: rosdistro_additional_recipes.yaml
# the shared rosdep mappings, with noetic's own on top (robostack.yaml)
conda_index:
  - ../../shared/robostack.yaml
  - robostack.yaml

build_number: 26

# one ROS distribution per environment; no run_constraints (see shared/vinca.yaml)
mutex_package:
  name: ros-distro-mutex
  version: "0.8.0"
  upper_bound: x.x

