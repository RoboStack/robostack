    dep_name: octomap
    max_pin: 'x.x'
    override_version: '1.10.0'
ompl:
  generate_dummy_package_with_run_deps:
    dep_name: ompl
    max_pin: 'x.x'
    override_version: '1.7.0'
# Do not unvendor urdfdom_py as the ROS1 required version is not on conda-forge
# urdfdom_py:
#   generate_dummy_package_with_run_deps:
#     dep_name: urdfdom-py
#     max_pin: 'x.x'
  add_host: ["ompl"]
  add_run: ["ompl"]
pcl_conversions:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
pcl_ros:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
pinocchio:
  generate_dummy_package_with_run_deps:
    dep_name: pinocchio
    max_pin: 'x.x.x'
    # the version on ros is outdated w.r.t. to the conda-forge one
    override_version: '3.9.0'
plotjuggler:
  # PlotJuggler (3.9 here, 3.17 too) is Qt5-only (find_package(Qt5 ...)): Qt 5, as in lyrical
  remove_host: ["qt6-main"]
  remove_run: ["qt6-main"]
  add_host: ["${{ 'elfutils' if linux }}", "protobuf", "qt-main"]
  add_run: ["qt-main"]
plotjuggler_ros:
  # Qt5-only like plotjuggler, which it links
  remove_host: ["qt6-main"]
  remove_run: ["qt6-main"]
  add_host: ["qt-main"]
  add_run: ["qt-main"]
posedetection_msgs:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
pybind11_catkin:
  # repackages conda-forge's pybind11 (patch); its CMake files find the headers in the prefix
  add_host: ["pybind11"]
  add_run: ["pybind11"]
python_qt_binding:
  add_run: ["adwaita-icon-theme"]
# sip bindings: python_qt_binding's sip_helper.cmake runs sip-build (sip, pyqt-builder)
# against PyQt6's .sip files in the host Python
qt_gui_cpp:
  add_host: ["sip", "pyqt-builder", "pyqt6"]
resource_retriever:
  add_host: ["libcurl"]
  add_run: ["libcurl"]
robot_self_filter:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
ros_ign_gazebo:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "${{ 'libuuid' if linux }}"]
rosbridge_library:
  add_run: ["pymongo"]
roseus:
  # C17 (GCC 15 defaults to C23, where `cell* (*)()` takes no arguments: defun.h)
  additional_cmake_args: "-DCMAKE_C_STANDARD=17 -DCMAKE_C_EXTENSIONS=ON -DCMAKE_C_FLAGS_INIT=-Wno-incompatible-pointer-types"
rosserial_python:
  add_run: ["pyserial"]
rtabmap:
  # libxml2-devel: VTK's CMake config needs LibXml2
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "pybind11", "tbb-devel", "liblzma-devel", "libxml2-devel"]
rtabmap_conversions:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "libnetcdf", "liblzma-devel"]
rtabmap_ros:
