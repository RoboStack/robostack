apriltag:
  # C11 (GCC 15 defaults to C23, where `void (*f)()` takes no arguments: zarray_vmap)
  additional_cmake_args: "-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON -DCMAKE_C_STANDARD=11 -DCMAKE_C_EXTENSIONS=ON"
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "${{ 'winpthreads-devel' if win }}"]
  add_run: ["${{ 'winpthreads-devel' if win }}"]
apriltag_ros:
  additional_cmake_args: "-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON"
  add_host: ["${{ 'winpthreads-devel' if win }}"]
audio_capture:
  add_host: ["libglib", "glib"]
audio_play:
  add_host: ["libglib", "glib"]
catkin:
  # genmsg and catkin's em templates use empy 3's API (em.RAW_OPT, ...)
  add_run: ["empy <4"]
checkerboard_detector:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
class_loader:
  add_host: ["${{ 'libcxx-devel 19.*' if osx }}"]
cob_object_detection_visualizer:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
draco:
  generate_dummy_package_with_run_deps:
    dep_name: draco
    max_pin: 'x.x.x'
    override_version: '1.5.7'
eigenpy:
  generate_dummy_package_with_run_deps:
    dep_name: eigenpy
    max_pin: 'x.x.x'
    # the version in ros is not compatible with conda-forge's coal and hpp_fcl builds
    override_version: '3.12.0'
euslisp:
  add_host: ["${{ 'xorg-libx11' if linux }}", "${{ 'libglu' if linux }}", "${{ 'libgl-devel' if linux }}", "${{ 'glew' if linux }}", "zlib", "libpng"]
face_detector:
