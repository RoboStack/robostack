rtabmap_rviz_plugins:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
rtabmap_viz:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
rviz:
  add_host: ["sip", "pyqt-builder", "pyqt6"]
safety_limiter:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
sick_tim:
  add_host: ["pkg-config"]
simple_grasping:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
spatio_temporal_voxel_layer:
  # oneTBB's CMake config; tf2_sensor_msgs for tf2::doTransform(PointCloud2) (patch)
  add_host: ["tbb-devel", "ros-noetic-tf2-sensor-msgs"]
  add_run: ["ros-noetic-tf2-sensor-msgs"]
stage:
  add_host: ["zlib", "libpng"]
swri_image_util:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
tesseract_collision:
  add_build: ["${{ 'llvm-openmp' if osx }}"]
ur_client_library:
  add_host: ["ros-noetic-catkin"]
visp:
  generate_dummy_package_with_run_deps:
    dep_name: visp
    max_pin: 'x.x'
    # the version on ros is older than conda-forge's
    override_version: '3.7.0'
vrpn:
  # its hand-written Python 3 bindings use PyEval_CallObject, gone since Python 3.13
  # (clang's -Wno-register for `register` in C++17: patch; static libraries on Windows:
  # win patch)
  additional_cmake_args: "-DVRPN_BUILD_PYTHON_HANDCODED_3X=OFF"
