autoware_utils_debug:
  add_host: ["fmt"]
autoware_utils_pcl:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
backward_ros:
  # binutils linux-only: -liberty not found on macOS.
  add_host: ["${{ 'binutils' if linux }}", "${{ 'elfutils' if linux }}", "ros2-ament-cmake-libraries"]
cartographer_ros:
  add_host: ["cartographer 2.*", "libboost-devel"]
cloudini_lib:
  add_host: ["eigen-abi-devel"]
cloudini_ros:
  add_host: ["eigen-abi-devel"]
depthai:
  add_host: ["${{ 'elfutils' if linux }}"]
easynav_bonxai_maps_manager:
  # drop once easynav_bonxai_maps_manager is updated to 0.4.2
  add_host: ["eigen-abi-devel"]
easynav_octomap_maps_manager:
  # drop once easynav_octomap_maps_manager is updated to 0.4.2
  add_host: ["octomap"]
foxglove_bridge:
  add_host: ["ros2-ament-cmake"]
geometric_shapes:
  add_host: ["octomap"]
gz_cmake_vendor:
  # Major version pin selects the Gazebo release matching jazzy (applies to all gz-* vendor packages).
  add_host: ["gz-cmake3"]
  add_run: ["gz-cmake3"]
gz_common_vendor:
  add_host: ["gz-common5"]
  add_run: ["gz-common5"]
gz_dartsim_vendor:
  add_host: ["dartsim-cpp"]
  add_run: ["dartsim-cpp"]
gz_fuel_tools_vendor:
  add_host: ["gz-fuel-tools9"]
  add_run: ["gz-fuel-tools9"]
gz_gui_vendor:
  # Gazebo Harmonic's gz-gui8 is Qt5; the Qt rosdep keys map to Qt6
  remove_host: ["qt6-main"]
  remove_run: ["qt6-main"]
  add_host: ["gz-gui8", "qt-main"]
  add_run: ["gz-gui8", "qt-main"]
gz_launch_vendor:
  add_host: ["gz-launch7"]
  add_run: ["gz-launch7"]
gz_math_vendor:
  add_host: ["gz-math7"]
  add_run: ["gz-math7"]
gz_msgs_vendor:
  add_host: ["gz-msgs10"]
  add_run: ["gz-msgs10"]
gz_ogre_next_vendor:
  # wraps conda-forge's ogre-next (no OGRE-Next build): no shaderc, as in lyrical
  add_host: ["ogre-next"]
  add_run: ["ogre-next"]
  remove_host: ["shaderc"]
  remove_run: ["shaderc"]
gz_physics_vendor:
  add_host: ["gz-physics7"]
  add_run: ["gz-physics7"]
gz_plugin_vendor:
  add_host: ["gz-plugin2"]
  add_run: ["gz-plugin2"]
gz_rendering_vendor:
  add_host: ["gz-rendering8", "swig"]
  # find_package(gz-rendering) requires find_package(OpenGL) to work
  add_run: ["gz-rendering8", "swig", "${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
  # libogre-dev is only needed to build gz-rendering from source; conda-forge's gz-rendering8
  # no longer links OGRE 1 (8.2.2_1), so an unpinned ogre resolves to 14.x, which clashes
  # with gz-gui8 (still built against ogre 1.10) in gz_gui_vendor.
  remove_host: ["ogre"]
  remove_run: ["ogre"]
gz_ros2_control:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
gz_ros2_control_demos:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
gz_sensors_vendor:
  add_host: ["gz-sensors8"]
  add_run: ["gz-sensors8"]
gz_sim_vendor:
  # Gazebo Harmonic's gz-gui8 is Qt5; the Qt rosdep keys map to Qt6
  remove_host: ["qt6-main"]
  remove_run: ["qt6-main"]
  add_host: ["gz-sim8", "qt-main"]
  add_run: ["gz-sim8", "qt-main"]
gz_tools_vendor:
  add_host: ["gz-tools2"]
  add_run: ["gz-tools2"]
gz_transport_vendor:
  add_host: ["gz-transport13"]
  add_run: ["gz-transport13"]
gz_utils_vendor:
  add_host: ["gz-utils2"]
  add_run: ["gz-utils2"]
image_view:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
  # Depends on opencv with gui support, see  https://github.com/ros-perception/image_pipeline/blob/746268fcfd21b389bc39ae60bb6345a53c838558/image_view/src/stereo_view_node.cpp#L253
  add_run: ["libopencv * *qt6*"]
intra_process_demo:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
  # Depends on opencv with gui support, see https://github.com/ros2/demos/blob/8f361a1ece2daae54016959f3ea9ab2e7692ddbb/intra_process_demo/include/image_pipeline/image_view_node.hpp#L58
  add_run: ["libopencv * *qt6*"]
lbr_ros2_control:
  add_host: ["ros2-kinematics-interface"]
  add_run: ["ros2-kinematics-interface"]
libg2o:
  add_host: ["${{ 'libglu' if linux }}", "${{ 'freeglut' if not osx }}"]
mimick_vendor:
  add_build: ["vcstool", "setuptools <81"]
  add_host: ["setuptools <81"]
moveit_visual_tools:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
nav2_constrained_smoother:
  add_host: ["${{ 'openblas' if win }}"]
nav2_mppi_controller:
  add_run: ["xtensor==0.25.0"]
nav2_rviz_plugins:
  # QStateMachine: Qt 6's StateMachine module
  add_host: ["qt6-scxml"]
nav2_util:
  add_host: ["libboost-devel"]
opennav_coverage:
  # package.xml misses deps that CMakeLists.txt finds
  add_host: [ros2-rclcpp-components, ros2-std-msgs, ros2-visualization-msgs]
  add_run: [ros2-rclcpp-components, ros2-std-msgs, ros2-visualization-msgs]
openvdb_vendor:
  add_host: ["openvdb"]
pcl_conversions:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "libboost-devel"]
plotjuggler:
  # PlotJuggler 3.17 is Qt5-only (find_package(Qt5 ...)); the Qt rosdep keys map to Qt6
  remove_host: ["qt6-main"]
  remove_run: ["qt6-main"]
  add_host: ["libxcb", "${{ 'elfutils' if linux }}", "ros2-ros-workspace", "git-lfs", "qt-main"]
  add_run: ["qt-main"]
plotjuggler_ros:
  # Qt5-only like plotjuggler, which it links
  remove_host: ["qt6-main"]
  remove_run: ["qt6-main"]
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "qt-main"]  # GL: as in shared/
  add_run: ["qt-main"]
py_trees:
  add_host: ["hatchling"]  # 2.6 builds with hatchling (as in lyrical)
py_trees_js:
  add_host:
  - hatchling
py_trees_ros_tutorials:
  # package.xml doesn't declare it
  add_run: ["pyqt6"]
python_qt_binding:
  # sip <6.16: 6.16.x regressed ABI targeting for PyQt-based bindings.
  add_host: ["pyqt-builder", "pep517", "qt6-main", "pyqt6", "sip <6.16"]
  add_run: ["pyqt-builder", "pep517", "qt6-main", "pyqt6"]
qt_gui:
  add_host: ["qt6-main", "pyqt6"]
  add_run: ["qt6-main", "pyqt6"]
qt_gui_cpp:
  add_build: ["${{ 'pyqt6' if (build_platform != target_platform) }}", "${{ 'qt6-main' if (build_platform != target_platform) }}"]
  # Only the PyQt (sip) bindings: pyside2 has no Python 3.14 build, and the shiboken
  # bindings are optional (built only when python_qt_binding's shiboken_helper finds it).
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "pyqt-builder", "pep517", "qt6-main", "pyqt6", "sip <6.16"]
  add_run: ["pyqt-builder", "pep517", "qt6-main", "pyqt6"]
rmf_traffic_editor:
  # 1.9 is Qt5-only (find_package(Qt5 ...), QRegExp etc.; Qt6 from 1.14); the Qt rosdep keys map to Qt6
  remove_host: ["qt6-main"]
  remove_run: ["qt6-main"]
  add_host: ["qt-main"]
  add_run: ["qt-main"]
roboplan_example_models:
  # src/resources.cpp uses dladdr() from dlfcn.h, which is POSIX-only.
  # On Windows we need to depend on dlfcn-win32 instead.
  add_host: ["${{ 'dlfcn-win32' if win }}"]
roboplan_ros_examples:
  # package.xml misses the ament_cmake dep; fixed in roboplan_ros 0.7.0, drop after that release.
  add_host: ["ros2-ament-cmake"]
ros_gz_sim:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
rtabmap:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "ceres-solver", "${{ 'libdc1394' if not win }}", "libusb", "vtk"]
rviz_ogre_vendor:
  add_host: ["zlib", "freeimage", "freetype", "assimp", "zziplib", "pugixml", "${{ 'libglu' if linux }}", "setuptools <81"]
  add_build: ["vcstool", "setuptools <81"]
  add_run: ["assimp"]
sdformat_vendor:
  add_host: ["sdformat14"]
  add_run: ["sdformat14"]
slam_toolbox:
  add_build: ["${{ 'qt6-main' if (build_platform != target_platform) }}"]
  # libblas/libcblas: picks up the netlib pin; blas-devel alone resolved to BLIS, whose
  # libblas aborts at load (CPU detection) on some aarch64 hosts and breaks `import numpy`
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "blas-devel", "libblas", "libcblas"]
spatio_temporal_voxel_layer:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "openvdb"]
swri_console:
  add_build: ["${{ 'qt6-main' if (build_platform != target_platform) }}"]
  add_host: ["libboost-devel", "qt6-main", "${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
  add_run: ["libboost"]
# TODO unvendor?!
uncrustify_vendor:
  add_build: ["vcstool", "setuptools <81"]
  add_host: ["setuptools <81"]
  # See https://github.com/ament/uncrustify_vendor/blob/jazzy/CMakeLists.txt#L19
  add_run: ["uncrustify >=0.78"]
ur_moveit_config:
  add_host: ["ros2-rclpy"]
  add_run: ["ros2-rclpy"]
vision_msgs_rviz_plugins:
  add_build: ["${{ 'qt6-main' if (build_platform != target_platform) }}"]
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
warehouse_ros_sqlite:
  add_host: ["ros2-sqlite3-vendor"]
  add_run: ["ros2-sqlite3-vendor"]
