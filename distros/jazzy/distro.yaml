# Settings of ros-jazzy that differ from the other distributions
# (everything else is shared, see the README).
# upload_to: where packages are uploaded, to this channel on each (prefix.dev, anaconda.org);
# read_from: where the builds look up what is already published
channel_name: robostack-jazzy
upload_to: [anaconda]
read_from: anaconda
conda_forge_pinning_version: 2026.09.01.16.28.00
conda_forge_migrations: [giflib6, go_macos, gstreamer128, hdf52, libboost190, pybind11_abi11, urdfdom6,
  vtk970]
pinning_overrides:
  libzenohc: [1.9.0]
  libzenohcxx: [1.9.0]
  xtensor: [0.25.0]
  python: [3.12.* *_cpython]
