# Settings of ros-jazzy that differ from the other distributions
# (everything else is shared, see the README).
# upload_to: where packages are uploaded, to this channel on each (prefix.dev, anaconda.org);
# read_from: where the builds look up what is already published
channel_name: robostack-jazzy
upload_to: [anaconda]
read_from: anaconda
pinning_overrides:
  # nav2_mppi_controller lists xsimd before xtensor: unpinned, the solver takes the newest
  # xsimd (14), which no xtensor >= 0.25 accepts, and falls back to xtensor 0.23.9, whose
  # xtensor_simd.hpp doesn't build with it. 0.25 brings a matching xsimd. (lyrical and
  # rolling's nav2_mppi_controller use Eigen instead.)
  xtensor: [0.25.0]
rosdistro_sync: jazzy/2026-10-05
