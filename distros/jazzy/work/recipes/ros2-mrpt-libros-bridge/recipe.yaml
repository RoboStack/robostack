# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-mrpt-libros-bridge
  version: 4.0.0
source:
  git: https://github.com/ros2-gbp/mrpt_ros_bridge-release.git
  tag: release/jazzy/mrpt_libros_bridge/4.0.0-1
  target_directory: ros2-mrpt-libros-bridge/src/work

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 27
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://www.mrpt.org/
  repository: https://github.com/MRPT/mrpt_ros_bridge
  license: BSD-3-Clause
  summary: Mobile Robot Programming Toolkit (MRPT) ros2bridge C++ library
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-gtest
    - ros2-distro-mutex 0.20.* jazzy_*
    - ros2-geometry-msgs
    - ros2-gps-msgs
    - ros2-mrpt-maps
    - ros2-mrpt-obs
    - ros2-nav-msgs
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rosbag2-cpp
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-stereo-msgs
    - ros2-tf2
    - ros2-tf2-geometry-msgs
  run:
    - python
    - ros2-distro-mutex 0.20.* jazzy_*
    - ros2-geometry-msgs
    - ros2-gps-msgs
    - ros2-mrpt-maps
    - ros2-mrpt-obs
    - ros2-nav-msgs
    - ros2-ros-workspace
    - ros2-rosbag2-cpp
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-stereo-msgs
    - ros2-tf2
    - ros2-tf2-geometry-msgs
