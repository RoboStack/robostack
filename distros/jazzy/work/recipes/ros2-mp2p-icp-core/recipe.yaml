# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-mp2p-icp-core
  version: 3.0.0
source:
  git: https://github.com/ros2-gbp/mp2p_icp-release.git
  tag: release/jazzy/mp2p_icp_core/3.0.0-1
  target_directory: ros2-mp2p-icp-core/src/work
  patches:
    - patch/ros2-mp2p-icp-core.patch

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 27
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://github.com/MOLAorg/mp2p_icp
  repository: https://github.com/MOLAorg/mp2p_icp
  license: BSD-3-Clause
  summary: C++ libraries for multi primitive-to-primitive (MP2P) ICP algorithms and point cloud processing pipelines, plus headless CLI applications. No GUI/display dependencies; see mp2p_icp_viz for the GUI apps.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - cli11
    - eigen
    - eigen-abi-devel
    - numpy
    - pip
    - python
    - ros2-distro-mutex 0.20.* jazzy_*
    - ros2-mola-common
    - ros2-mola-imu-preintegration
    - ros2-mrpt-containers
    - ros2-mrpt-maps
    - ros2-mrpt-obs
    - ros2-mrpt-poses
    - ros2-mrpt-rtti
    - ros2-mrpt-serialization
    - ros2-mrpt-system
    - ros2-mrpt-tfest
    - ros2-mrpt-topography
    - ros2-ros-environment
    - ros2-ros-workspace
    - tbb
    - tbb-devel
  run:
    - cli11
    - eigen
    - eigen-abi-devel
    - python
    - ros2-distro-mutex 0.20.* jazzy_*
    - ros2-mola-common
    - ros2-mola-imu-preintegration
    - ros2-mrpt-containers
    - ros2-mrpt-maps
    - ros2-mrpt-obs
    - ros2-mrpt-poses
    - ros2-mrpt-rtti
    - ros2-mrpt-serialization
    - ros2-mrpt-system
    - ros2-mrpt-tfest
    - ros2-mrpt-topography
    - ros2-ros-workspace
    - tbb
    - tbb-devel
