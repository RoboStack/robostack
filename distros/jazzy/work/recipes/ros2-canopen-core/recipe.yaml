# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-canopen-core
  version: 0.3.4
source:
  git: https://github.com/ros2-gbp/ros2_canopen-release.git
  tag: release/jazzy/canopen_core/0.3.4-1
  target_directory: ros2-canopen-core/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 27
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/ros-industrial/ros2_canopen
  license: Apache-2.0
  summary: Core ros2_canopen functionalities such as DeviceContainer and master
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - libboost-devel
    - libboost-python-devel
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-lint-auto
    - ros2-canopen-interfaces
    - ros2-distro-mutex 0.20.* jazzy_*
    - ros2-lely-core-libraries
    - ros2-lifecycle-msgs
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-rclcpp-lifecycle
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-yaml-cpp-vendor
  run:
    - libboost-devel
    - libboost-python-devel
    - python
    - ros2-canopen-interfaces
    - ros2-distro-mutex 0.20.* jazzy_*
    - ros2-lely-core-libraries
    - ros2-lifecycle-msgs
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-rclcpp-lifecycle
    - ros2-ros-workspace
    - ros2-yaml-cpp-vendor
