# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-fuse-variables
  version: 1.1.6
source:
  git: https://github.com/ros2-gbp/fuse-release.git
  tag: release/jazzy/fuse_variables/1.1.6-1
  target_directory: ros2-fuse-variables/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 27
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/locusrobotics/fuse
  license: BSD-3-Clause
  summary: The fuse_variables package provides a set of commonly used variable types, such as 2D and 3D positions, \ orientations, velocities, and accelerations.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - ceres-solver
    - numpy
    - pip
    - python
    - ros2-ament-cmake-gtest
    - ros2-ament-cmake-pytest
    - ros2-ament-cmake-ros
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-distro-mutex 0.20.* jazzy_*
    - ros2-fuse-core
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-ros-environment
    - ros2-ros-workspace
  run:
    - ceres-solver
    - python
    - ros2-distro-mutex 0.20.* jazzy_*
    - ros2-fuse-core
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-ros-workspace
