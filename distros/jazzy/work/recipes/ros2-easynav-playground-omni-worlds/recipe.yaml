# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-easynav-playground-omni-worlds
  version: 0.5.0
source:
  git: https://github.com/EasyNavigation/easynav_playgrounds-release.git
  tag: release/jazzy/easynav_playground_omni_worlds/0.5.0-1
  target_directory: ros2-easynav-playground-omni-worlds/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 27
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/EasyNavigation/easynav_playgrounds
  license: MIT OR Apache-2.0
  summary: 'Gazebo (Harmonic or newer) simulation of omnidirectional robots for the EasyNav playgrounds: two mazes and their maps, the kinematics node, and the launcher that spawns the chosen robot with its controllers and the ROS-Gazebo bridge.'
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - eigen
    - eigen-abi-devel
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-distro-mutex 0.20.* jazzy_*
    - ros2-geometry-msgs
    - ros2-nav-msgs
    - ros2-rclcpp
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-tf2
    - ros2-tf2-geometry-msgs
    - ros2-tf2-ros
  run:
    - eigen
    - eigen-abi-devel
    - python
    - ros2-controller-manager
    - ros2-distro-mutex 0.20.* jazzy_*
    - ros2-easynav-playground-omni-description
    - ros2-forward-command-controller
    - ros2-geometry-msgs
    - ros2-gz-sim-vendor
    - ros2-joint-state-broadcaster
    - ros2-launch
    - ros2-launch-ros
    - ros2-launch-yaml
    - ros2-nav-msgs
    - ros2-rclcpp
    - ros2-rclpy
    - ros2-robot-state-publisher
    - ros2-ros-gz-bridge
    - ros2-ros-gz-sim
    - ros2-ros-workspace
    - ros2-rviz2
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-tf2
    - ros2-tf2-geometry-msgs
    - ros2-tf2-ros
    - ros2-xacro
