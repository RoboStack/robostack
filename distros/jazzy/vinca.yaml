extends: ../../shared/vinca.yaml
ros_distro: jazzy
patch_dir: patch
rosdistro_snapshot: rosdistro_snapshot.yaml
rosdistro_additional_recipes: rosdistro_additional_recipes.yaml
# Qt5 for the Qt5 rosdep keys (see robostack.yaml); layered over shared/robostack.yaml
conda_index: [robostack.yaml]


# mapping for package keys
build_number: 27

mutex_package:
  version: "0.20.0"

packages_exclude:
  - rtabmap_rviz_plugins  # links PCL, whose VTK is Qt 6 on conda-forge, into a Qt 5 RViz plugin (jazzy's RViz is Qt 5); rtabmap_viz is fine, it uses only rtabmap's Qt 6

