octomap_rviz_plugins:
  build_number: 28
plotjuggler:
  build_number: 30
  add_host: ["libxcb", "${{ 'elfutils' if linux }}", "ros2-ros-workspace", "git-lfs"]
rtabmap_slam:  # its recipe test stops the node for sure (package tests hung on macOS)
  build_number: 28
rviz_2d_overlay_plugins:
  build_number: 28
rviz_common:
  build_number: 28
rviz_default_plugins:
  build_number: 28
rviz_imu_plugin:
  build_number: 28
rviz_ogre_vendor:
  additional_cmake_args: "-DRVIZ_OGRE_VENDOR_MANGLE_NAME_OF_LIBRARIES_USED_BY_RVIZ=ON"
  build_number: 29  # built without the EXR codec (ros2-rviz-ogre-vendor.patch), absolute install names on macOS (.osx.patch)
  add_host: ["zlib", "freeimage", "freetype", "assimp", "zziplib", "pugixml", "${{ 'libglu' if linux }}", "setuptools <81"]
  add_build: ["vcstool", "setuptools <81"]
