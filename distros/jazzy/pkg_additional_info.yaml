apriltag:
  generate_dummy_package_with_run_deps:
    dep_name: apriltag
    max_pin: 'x.x.x'
autoware_utils_debug:
  add_host: ["fmt"]
autoware_utils_pcl:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
backward_ros:
  # binutils linux-only: -liberty not found on macOS.
  add_host: ["${{ 'binutils' if linux }}", "${{ 'elfutils' if linux }}", "ros2-ament-cmake-libraries"]
cartographer_ros:
  additional_cmake_args: "-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON"
  add_host: ["cartographer 2.*", "libboost-devel"]
cloudini_lib:
  add_host: ["eigen-abi-devel"]
cloudini_ros:
  add_host: ["eigen-abi-devel"]
depthai:
  add_host: ["${{ 'elfutils' if linux }}"]
easynav_bonxai_maps_manager:
  # drop once easynav_bonxai_maps_manager is updated to 0.4.2
  add_host: ["eigen-abi-devel"]
easynav_octomap_maps_manager:
  # drop once easynav_octomap_maps_manager is updated to 0.4.2
  add_host: ["octomap"]
eigenpy:
  generate_dummy_package_with_run_deps:
    dep_name: eigenpy
    max_pin: 'x.x.x'
    override_version: '3.13.0'
foxglove_bridge:
  add_host: ["ros2-ament-cmake"]
geometric_shapes:
  add_host: ["octomap"]
gtsam:
  generate_dummy_package_with_run_deps:
    dep_name: gtsam
    max_pin: 'x.x'
    # jazzy is on 4.2.0, but we stick to 4.2.1 for compat with the rest of conda-forge
    override_version: '4.2.1'
gz_cmake_vendor:
  # Major version pin selects the Gazebo release matching jazzy (applies to all gz-* vendor packages).
  add_host: ["gz-cmake3"]
  add_run: ["gz-cmake3"]
gz_common_vendor:
  add_host: ["gz-common5"]
  add_run: ["gz-common5"]
gz_dartsim_vendor:
  add_host: ["dartsim-cpp"]
  add_run: ["dartsim-cpp"]
gz_fuel_tools_vendor:
  add_host: ["gz-fuel-tools9"]
  add_run: ["gz-fuel-tools9"]
gz_gui_vendor:
  add_host: ["gz-gui8"]
  add_run: ["gz-gui8"]
gz_launch_vendor:
  add_host: ["gz-launch7"]
  add_run: ["gz-launch7"]
gz_math_vendor:
  add_host: ["gz-math7"]
  add_run: ["gz-math7"]
gz_msgs_vendor:
  add_host: ["gz-msgs10"]
  add_run: ["gz-msgs10"]
gz_physics_vendor:
  add_host: ["gz-physics7"]
  add_run: ["gz-physics7"]
gz_plugin_vendor:
  add_host: ["gz-plugin2"]
  add_run: ["gz-plugin2"]
gz_rendering_vendor:
  add_host: ["gz-rendering8", "swig"]
  # find_package(gz-rendering) requires find_package(OpenGL) to work
  add_run: ["gz-rendering8", "swig", "${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
gz_ros2_control:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
gz_ros2_control_demos:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
gz_sensors_vendor:
  add_host: ["gz-sensors8"]
  add_run: ["gz-sensors8"]
gz_sim_vendor:
  add_host: ["gz-sim8"]
  add_run: ["gz-sim8"]
gz_tools_vendor:
  add_host: ["gz-tools2"]
  add_run: ["gz-tools2"]
gz_transport_vendor:
  add_host: ["gz-transport13"]
  add_run: ["gz-transport13"]
gz_utils_vendor:
  add_host: ["gz-utils2"]
  add_run: ["gz-utils2"]
hpp_fcl:
  generate_dummy_package_with_run_deps:
    dep_name: hpp-fcl
    max_pin: 'x.x.x'
    # the version on ros is outdated w.r.t. to the conda-forge one
    override_version: '3.0.4'
iceoryx_binding_c:
  generate_dummy_package_with_run_deps:
    dep_name: libiceoryx-binding-c
    max_pin: 'x.x'
    override_version: '2.95.8'
iceoryx_hoofs:
  generate_dummy_package_with_run_deps:
    dep_name: libiceoryx-hoofs
    max_pin: 'x.x'
    override_version: '2.95.8'
iceoryx_posh:
  generate_dummy_package_with_run_deps:
    dep_name: libiceoryx-posh
    max_pin: 'x.x'
    override_version: '2.95.8'
image_view:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
  # Depends on opencv with gui support, see  https://github.com/ros-perception/image_pipeline/blob/746268fcfd21b389bc39ae60bb6345a53c838558/image_view/src/stereo_view_node.cpp#L253
  add_run: ["libopencv * *qt6*"]
intra_process_demo:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
  # Depends on opencv with gui support, see https://github.com/ros2/demos/blob/8f361a1ece2daae54016959f3ea9ab2e7692ddbb/intra_process_demo/include/image_pipeline/image_view_node.hpp#L58
  add_run: ["libopencv * *qt6*"]
lbr_ros2_control:
  add_host: ["ros2-kinematics-interface"]
  add_run: ["ros2-kinematics-interface"]
libcamera:
  generate_dummy_package_with_run_deps:
    dep_name: libcamera
    # see https://git.libcamera.org/libcamera/libcamera.git/tree/meson.build?h=v0.5.1#n65
    max_pin: 'x.x'
    # jazzy is on 0.3.0, but we stick to 0.5.0 for compat with the rest of conda-forge
    override_version: '0.5.0'
libg2o:
  additional_cmake_args: "-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON"
  add_host: ["${{ 'libglu' if linux }}", "${{ 'freeglut' if not osx }}"]
librealsense2:
  generate_dummy_package_with_run_deps:
    dep_name: librealsense
    max_pin: 'x.x'
    override_version: 2.58.3
magic_enum:
  generate_dummy_package_with_run_deps:
    dep_name: magic_enum
    max_pin: 'x.x'
mcap_vendor:
  additional_cmake_args:
    if: unix
    then: '-DCMAKE_CXX_FLAGS="-include cstdint"'
mimick_vendor:
  add_build: ["vcstool", "setuptools <81"]
  add_host: ["setuptools <81"]
moveit_visual_tools:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
mrpt_gui:
  # Overrides shared/: this distribution maps Qt to qt-main 5.15, whose builds need
  # gstreamer <1.27, while the pinned wxwidgets (3.3.3) needs gstreamer 1.28. A version
  # spec bypasses that pin, so the solver picks a wxwidgets that coexists with qt-main.
  add_host: ["wxwidgets >=3.2", "${{ 'glad' if win }}"]  # glad: as in shared/
nav2_constrained_smoother:
  add_host: ["${{ 'openblas' if win }}"]
nav2_mppi_controller:
  add_run: ["xtensor==0.25.0"]
nav2_util:
  add_host: ["libboost-devel"]
octomap:
  generate_dummy_package_with_run_deps:
    dep_name: octomap
    max_pin: 'x.x'
ompl:
  generate_dummy_package_with_run_deps:
    dep_name: ompl
    max_pin: 'x.x'
    # OMPL 2 is rebuilt for Boost 1.90 on all supported platforms.
    override_version: '2.0.1'
opennav_coverage:
  # package.xml misses deps that CMakeLists.txt finds
  add_host: [ros2-rclcpp-components, ros2-std-msgs, ros2-visualization-msgs]
  add_run: [ros2-rclcpp-components, ros2-std-msgs, ros2-visualization-msgs]
openvdb_vendor:
  add_host: ["openvdb"]
pcl_conversions:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "libboost-devel"]
proxsuite:
  generate_dummy_package_with_run_deps:
    dep_name: proxsuite
    max_pin: 'x.x'
    override_version: '0.7.3'
py_trees:
  generate_dummy_package_with_run_deps:
    dep_name: py-trees
    max_pin: 'x.x.x'
    override_version: '2.6.0'
  add_host: ["hatchling"]  # 2.6 builds with hatchling (as in lyrical)
py_trees_js:
  add_host:
  - hatchling
py_trees_ros_tutorials:
  # the mock GUI imports PyQt5 (jazzy's rqt stack is Qt5 too), but package.xml doesn't declare it
  add_run: ["pyqt"]
python_qt_binding:
  # sip <6.16: exact pin conflicts with pyqt5-sip's range; unpinned risks the 6.16.x ABI regression.
  add_host: ["pyqt-builder", "sip <6.16"]
  add_run: ["pyqt-builder"]
qt_gui_cpp:
  add_build: ["${{ 'pyqt' if (build_platform != target_platform) }}", "${{ 'qt-main' if (build_platform != target_platform) }}"]
  # Same sip <6.16 fix as python_qt_binding above (pulls its own pyqt5/pyqt5-sip into this host solve too).
  # Only the PyQt (sip) bindings: pyside2 has no Python 3.14 build, and the shiboken
  # bindings are optional (built only when python_qt_binding's shiboken_helper finds it).
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "pyqt-builder", "pep517", "sip <6.16"]
  add_run: ["pyqt-builder", "pep517"]
roboplan:
  generate_dummy_package_with_run_deps:
    dep_name: roboplan-python
    max_pin: 'x.x'
roboplan_cartesian_planning:
  generate_dummy_package_with_run_deps:
    dep_name: roboplan-cartesian-planning-python
    max_pin: 'x.x'
roboplan_common:
  generate_dummy_package_with_run_deps:
    dep_name: roboplan-common
    max_pin: 'x.x'
roboplan_core:
  generate_dummy_package_with_run_deps:
    dep_name: roboplan-core-python
    max_pin: 'x.x'
roboplan_example_models:
  generate_dummy_package_with_run_deps:
    dep_name: roboplan-example-models-python
    max_pin: 'x.x'
  # src/resources.cpp uses dladdr() from dlfcn.h, which is POSIX-only.
  # On Windows we need to depend on dlfcn-win32 instead.
  add_host: ["${{ 'dlfcn-win32' if win }}"]
roboplan_oink:
  generate_dummy_package_with_run_deps:
    dep_name: roboplan-oink-python
    max_pin: 'x.x'
roboplan_ros_examples:
  # package.xml misses the ament_cmake dep; fixed in roboplan_ros 0.7.0, drop after that release.
  add_host: ["ros2-ament-cmake"]
roboplan_rrt:
  generate_dummy_package_with_run_deps:
    dep_name: roboplan-rrt-python
    max_pin: 'x.x'
roboplan_simple_ik:
  generate_dummy_package_with_run_deps:
    dep_name: roboplan-simple-ik-python
    max_pin: 'x.x'
roboplan_toppra:
  generate_dummy_package_with_run_deps:
    dep_name: roboplan-toppra-python
    max_pin: 'x.x'
ros_gz_sim:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
ros_image_to_qimage:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
rqt_gui_cpp:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
rqt_image_overlay:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
rqt_image_overlay_layer:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
rqt_image_view:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
rtabmap:
  additional_cmake_args: -DBUILD_TESTING=OFF
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "ceres-solver", "${{ 'libdc1394' if not win }}", "libusb", "vtk"]
sdformat_vendor:
  add_host: ["sdformat14"]
  add_run: ["sdformat14"]
slam_toolbox:
  add_build: ["${{ 'qt-main' if (build_platform != target_platform) }}"]
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "blas-devel"]
swri_console:
  add_build: ["${{ 'qt-main' if (build_platform != target_platform) }}"]
  add_host: ["libboost-devel", "qt-main", "${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
  add_run: ["libboost", "qt-main"]
# TODO unvendor?!
uncrustify_vendor:
  add_build: ["vcstool", "setuptools <81"]
  add_host: ["setuptools <81"]
  # See https://github.com/ament/uncrustify_vendor/blob/jazzy/CMakeLists.txt#L19
  add_run: ["uncrustify >=0.78"]
ur_moveit_config:
  add_host: ["ros2-rclpy"]
  add_run: ["ros2-rclpy"]
urdfdom:
  generate_dummy_package_with_run_deps:
    dep_name: urdfdom
    max_pin: 'x.x'
    override_version: '6.0'
urdfdom_headers:
