extends: ../../shared/vinca.yaml
ros_distro: humble
patch_dir: patch
rosdistro_snapshot: rosdistro_snapshot.yaml
rosdistro_additional_recipes: rosdistro_additional_recipes.yaml

build_number: 20

mutex_package:
  # new build without run_constraints (same version as the published ones)
  build_number: 21
  version: "0.10.0"

packages_exclude:

  - if: not linux
    then:
      - ament_cmake_xmllint
      - ament_xmllint
      - mimick_vendor
      - mujoco_ros2_control
      - mujoco_ros2_control_demos
      - mujoco_vendor
      - osrf_testing_tools_cpp
      - performance_test_fixture
      - rclc_examples
      - rmw_connextdds

  # humble's Gazebo is Ignition Fortress (libignition-gazebo6), not installable on win-64 (libode)
  - if: win
    then:
      - gz_ros2_control
      - gz_ros2_control_demos
      - ros_gz_sim
      - ros_gz_sim_demos
      - ros_ign_gazebo
      - ros_ign_gazebo_demos
      - ros_ign_image
      - test_ros_gz_bridge
      - velodyne_gazebo_plugins

# These are the packages that are built on all platforms (only a subset, to reduce maintainer load)


# Shared selections that humble doesn't build on some platforms (see also
# packages_skip_by_deps / packages_remove_from_deps).

packages_skip:
  - as2_behaviors_trajectory_generation  # nested FetchContent'd NLopt violates CMake 4's minimum version floor; too fragile to patch, skip for now

  - if: not linux
    then:
      - joy_linux

  # rosgraph_monitor: no distro builds it on Windows; the rest need Ignition Fortress (libignition-gazebo6), not installable on win-64
  - if: win
    then:
      - foxglove_bridge  # humble 3.3.0 has no Windows foxglove SDK download (only Linux/macOS in our patch)
      - irobot_create_ignition_bringup
      - irobot_create_ignition_plugins
      - pinocchio  # doesn't resolve on win-64 (to investigate)
      - plotjuggler  # QDomDocument unresolved (LNK2019) and no exports; rolling's large win patch is for 3.17
      - plotjuggler_ros  # needs plotjuggler
      - rosgraph_monitor
      - rosx_introspection  # MSVC C1012 in the AMENT_INDEX_CPP/RCLCPP_VERSION_GTE checks (to investigate)
      - turtlebot4_ignition_bringup
      - turtlebot4_ignition_gui_plugins
      - turtlebot4_simulator

packages_select_by_deps:

  # Not on win-64 elsewhere (MSVC C1083 in its _msgs), but humble's 0.15 builds there
  - if: win
    then:
      - cartographer_ros
      - rosbag2_performance_benchmarking
      - rplidar_ros
      - serial_driver  # humble's builds there (LNK1181 on rolling)
      - udp_driver

  # humble's popf has a macOS patch (patch/ros2-popf.patch); elsewhere plansys2 is Linux only
  - if: osx
    then:
      - plansys2_bringup
      - plansys2_bt_actions
      - smacc2

