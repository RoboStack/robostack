# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-ignition-cmake2-vendor
  version: 0.0.2
source:
  git: https://github.com/ros2-gbp/ignition_cmake2_vendor-release.git
  tag: release/humble/ignition_cmake2_vendor/0.0.2-2
  target_directory: ros2-ignition-cmake2-vendor/src/work

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 22
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://github.com/ignitionrobotics/ign-cmake
  repository: https://github.com/ignition-release/ignition_cmake2_vendor
  license: Apache-2.0
  summary: This package provides the Ignition CMake 2.x library.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
    - if: build_platform != target_platform
      then:
        - doxygen
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - graphviz
    - libignition-cmake2
    - numpy
    - pip
    - python
    - ros2-ament-cmake-copyright
    - ros2-ament-cmake-lint-cmake
    - ros2-ament-cmake-test
    - ros2-ament-cmake-xmllint
    - ros2-distro-mutex 0.11.* humble_*
    - ros2-ros-environment
    - ros2-ros-workspace
    - if: build_platform == target_platform
      then:
        - doxygen
  run:
    - libignition-cmake2
    - python
    - ros2-distro-mutex 0.11.* humble_*
    - ros2-ros-workspace
