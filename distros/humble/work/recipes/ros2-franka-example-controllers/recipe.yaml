# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-franka-example-controllers
  version: 1.0.0
source:
  git: https://github.com/ros2-gbp/franka_ros2-release.git
  tag: release/humble/franka_example_controllers/1.0.0-1
  target_directory: ros2-franka-example-controllers/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 22
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/frankaemika/franka_ros2
  license: Apache-2.0
  summary: franka_example_controllers provides example code for controllingFranka Robotics research robots with ros2_control
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-clang-format
    - ros2-ament-cmake-clang-tidy
    - ros2-ament-cmake-copyright
    - ros2-ament-cmake-cppcheck
    - ros2-ament-cmake-flake8
    - ros2-ament-cmake-gmock
    - ros2-ament-cmake-lint-cmake
    - ros2-ament-cmake-pep257
    - ros2-ament-cmake-xmllint
    - ros2-controller-interface
    - ros2-controller-manager
    - ros2-distro-mutex 0.11.* humble_*
    - ros2-franka-msgs
    - ros2-franka-semantic-components
    - ros2-hardware-interface-testing
    - ros2-moveit-core
    - ros2-pinocchio
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-rclcpp-lifecycle
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-ros2-control-test-assets
    - ros2-sensor-msgs
    - ros2-std-srvs
  run:
    - python
    - ros2-controller-interface
    - ros2-distro-mutex 0.11.* humble_*
    - ros2-franka-msgs
    - ros2-franka-semantic-components
    - ros2-moveit-core
    - ros2-pinocchio
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-rclcpp-lifecycle
    - ros2-ros-workspace
    - ros2-sensor-msgs
    - ros2-std-srvs
