# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-octomap
  version: 1.10.0
build:
  number: 22
  script: ''
requirements:
  run:
  - octomap >=1.10.0, <1.11.0a0
  - ros2-distro-mutex 0.11.* humble_*
about:
  homepage: http://octomap.github.io
  repository: https://github.com/octomap/octomap
  license: BSD-3-Clause
  summary: The OctoMap library implements a 3D occupancy grid mapping approach, providing data structures and mapping algorithms in C++. The map implementation is based on an octree. See http://octomap.github.io for details.
extra:
  recipe-maintainers:
  - ros-forge
