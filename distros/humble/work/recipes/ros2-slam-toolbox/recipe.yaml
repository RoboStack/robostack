# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-slam-toolbox
  version: 2.6.10
source:
  git: https://github.com/SteveMacenski/slam_toolbox-release.git
  tag: release/humble/slam_toolbox/2.6.10-1
  target_directory: ros2-slam-toolbox/src/work
  patches:
    - patch/ros2-slam-toolbox.patch
    - patch/ros2-slam-toolbox.win.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 22
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/SteveMacenski/slam_toolbox
  license: LGPL-2.1-or-later
  summary: This package provides a sped up improved slam karto with updated SDK and visualization and modification toolsets
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
    - ${{ 'qt-main' if (build_platform != target_platform) }}
    - if: target_platform == 'emscripten-wasm32'
      then:
        - ros2-rosidl-default-generators
    - if: build_platform != target_platform
      then:
        - qt-main
  host:
    - ${{ 'libgl-devel' if linux }}
    - ${{ 'libopengl-devel' if linux }}
    - blas-devel
    - if: build_platform == target_platform
      then:
        - pkg-config
    - ceres-solver
    - eigen
    - eigen-abi-devel
    - libboost-devel
    - libboost-python-devel
    - liblapack
    - numpy
    - pip
    - python
    - qt-main
    - ros2-ament-cmake
    - ros2-ament-cmake-cpplint
    - ros2-ament-cmake-flake8
    - ros2-ament-cmake-gtest
    - ros2-ament-cmake-uncrustify
    - ros2-ament-lint-auto
    - ros2-builtin-interfaces
    - ros2-distro-mutex 0.11.* humble_*
    - ros2-interactive-markers
    - ros2-launch
    - ros2-launch-testing
    - ros2-message-filters
    - ros2-nav-msgs
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rosidl-default-generators
    - ros2-rviz-common
    - ros2-rviz-default-plugins
    - ros2-rviz-ogre-vendor
    - ros2-rviz-rendering
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-tf2
    - ros2-tf2-geometry-msgs
    - ros2-tf2-ros
    - ros2-tf2-sensor-msgs
    - ros2-visualization-msgs
    - suitesparse
    - tbb
    - tbb-devel
  run:
    - blas-devel
    - ceres-solver
    - eigen
    - eigen-abi-devel
    - libboost-devel
    - libboost-python-devel
    - liblapack
    - python
    - qt-main
    - ros2-builtin-interfaces
    - ros2-distro-mutex 0.11.* humble_*
    - ros2-interactive-markers
    - ros2-message-filters
    - ros2-nav-msgs
    - ros2-nav2-map-server
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-ros-workspace
    - ros2-rosidl-default-generators
    - ros2-rviz-common
    - ros2-rviz-default-plugins
    - ros2-rviz-ogre-vendor
    - ros2-rviz-rendering
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-tf2
    - ros2-tf2-geometry-msgs
    - ros2-tf2-ros
    - ros2-tf2-sensor-msgs
    - ros2-visualization-msgs
    - suitesparse
    - tbb
    - tbb-devel
