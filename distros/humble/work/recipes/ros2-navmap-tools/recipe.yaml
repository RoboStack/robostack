# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-navmap-tools
  version: 0.6.0
source:
  git: https://github.com/EasyNavigation/NavMap-release.git
  tag: release/humble/navmap_tools/0.6.0-1
  target_directory: ros2-navmap-tools/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 22
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/EasyNavigation/NavMap
  license: Apache-2.0
  summary: "Tools and utilities for building and testing NavMaps: a GIS-to-NavMap/Gazebo\n    generator (given a GPS center and a size in meters), a PointCloud-to-NavMap\n    mesh builder, and a NavMap file publisher for RViz2."
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - pytest
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-gtest
    - ros2-ament-cmake-pytest
    - ros2-ament-cmake-python
    - ros2-ament-copyright
    - ros2-ament-flake8
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-ament-pep257
    - ros2-ament-xmllint
    - ros2-distro-mutex 0.11.* humble_*
    - ros2-navmap-core
    - ros2-navmap-ros
    - ros2-navmap-ros-interfaces
    - ros2-pcl-conversions
    - ros2-rclcpp
    - ros2-ros-environment
    - ros2-ros-workspace
  run:
    - numpy
    - pillow
    - platformdirs
    - pyproj
    - python
    - requests
    - ros2-ament-index-python
    - ros2-distro-mutex 0.11.* humble_*
    - ros2-nav-msgs
    - ros2-navmap-core
    - ros2-navmap-ros
    - ros2-navmap-ros-interfaces
    - ros2-pcl-conversions
    - ros2-rclcpp
    - ros2-rclpy
    - ros2-ros-workspace
    - ros2-sensor-msgs
    - ros2-sensor-msgs-py
    - ros2-tf2-ros-py
