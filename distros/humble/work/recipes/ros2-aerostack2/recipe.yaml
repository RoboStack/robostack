# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-aerostack2
  version: 1.1.3
source:
  git: https://github.com/ros2-gbp/aerostack2-release.git
  tag: release/humble/aerostack2/1.1.3-1
  target_directory: ros2-aerostack2/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 22
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/aerostack2/aerostack2
  license: BSD-3-Clause
  summary: Aerostack2 is a ROS2-based framework for the development of autonomous systems for aerial robotics.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-distro-mutex 0.11.* humble_*
    - ros2-ros-environment
    - ros2-ros-workspace
  run:
    - python
    - ros2-as2-alphanumeric-viewer
    - ros2-as2-behavior
    - ros2-as2-behavior-tree
    - ros2-as2-behaviors-motion
    - ros2-as2-behaviors-path-planning
    - ros2-as2-behaviors-perception
    - ros2-as2-behaviors-platform
    - ros2-as2-behaviors-trajectory-generation
    - ros2-as2-cli
    - ros2-as2-core
    - ros2-as2-external-object-to-tf
    - ros2-as2-gazebo-assets
    - ros2-as2-geozones
    - ros2-as2-keyboard-teleoperation
    - ros2-as2-map-server
    - ros2-as2-motion-controller
    - ros2-as2-motion-reference-handlers
    - ros2-as2-msgs
    - ros2-as2-platform-gazebo
    - ros2-as2-platform-multirotor-simulator
    - ros2-as2-python-api
    - ros2-as2-realsense-interface
    - ros2-as2-rviz-plugins
    - ros2-as2-state-estimator
    - ros2-as2-usb-camera-interface
    - ros2-as2-visualization
    - ros2-distro-mutex 0.11.* humble_*
    - ros2-ros-workspace
