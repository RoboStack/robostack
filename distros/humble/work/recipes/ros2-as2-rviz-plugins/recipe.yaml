# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-as2-rviz-plugins
  version: 1.1.3
source:
  git: https://github.com/ros2-gbp/aerostack2-release.git
  tag: release/humble/as2_rviz_plugins/1.1.3-1
  target_directory: ros2-as2-rviz-plugins/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 22
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/aerostack2/aerostack2
  license: BSD-3-Clause
  summary: A very simple plugin for RViz.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
    - if: build_platform != target_platform
      then:
        - qt-main
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - libgl-devel
    - libopengl-devel
    - numpy
    - pip
    - python
    - qt-main
    - ros2-ament-cmake
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-as2-core
    - ros2-as2-motion-reference-handlers
    - ros2-as2-msgs
    - ros2-distro-mutex 0.11.* humble_*
    - ros2-geometry-msgs
    - ros2-rclcpp
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rviz-common
    - ros2-rviz-rendering
    - ros2-sensor-msgs
  run:
    - libgl-devel
    - libopengl-devel
    - python
    - qt-main
    - ros2-as2-core
    - ros2-as2-motion-reference-handlers
    - ros2-as2-msgs
    - ros2-distro-mutex 0.11.* humble_*
    - ros2-geometry-msgs
    - ros2-rclcpp
    - ros2-ros-workspace
    - ros2-rviz-common
    - ros2-rviz-rendering
    - ros2-sensor-msgs
