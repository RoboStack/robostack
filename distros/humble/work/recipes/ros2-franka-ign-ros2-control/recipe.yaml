# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-franka-ign-ros2-control
  version: 1.0.0
source:
  git: https://github.com/ros2-gbp/franka_ros2-release.git
  tag: release/humble/franka_ign_ros2_control/1.0.0-1
  target_directory: ros2-franka-ign-ros2-control/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 22
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/frankaemika/franka_ros2
  license: Apache-2.0
  summary: Ignition ros2_control package allows to control simulated robots using ros2_control framework.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - ${{ 'libgl-devel' if linux }}
    - if: build_platform == target_platform
      then:
        - pkg-config
    - libgl-devel
    - libignition-gazebo6
    - libignition-plugin1
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-index-cpp
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-controller-manager
    - ros2-distro-mutex 0.11.* humble_*
    - ros2-franka-hardware
    - ros2-hardware-interface
    - ros2-kdl-parser
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-rclcpp-lifecycle
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-tf2-eigen
    - ros2-tf2-geometry-msgs
    - ros2-urdf
    - ros2-yaml-cpp-vendor
  run:
    - libgl-devel
    - libignition-gazebo6
    - libignition-plugin1
    - python
    - ros2-ament-index-cpp
    - ros2-controller-manager
    - ros2-distro-mutex 0.11.* humble_*
    - ros2-franka-hardware
    - ros2-hardware-interface
    - ros2-kdl-parser
    - ros2-pluginlib
    - ros2-rclcpp
    - ros2-rclcpp-lifecycle
    - ros2-ros-workspace
    - ros2-tf2-eigen
    - ros2-tf2-geometry-msgs
    - ros2-urdf
    - ros2-yaml-cpp-vendor
