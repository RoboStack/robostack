# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-rqt
  version: 1.1.10
source:
  git: https://github.com/ros2-gbp/rqt-release.git
  tag: release/humble/rqt/1.1.10-2
  target_directory: ros2-rqt/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_python.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_python.bat' }}
  number: 22
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://ros.org/wiki/rqt
  repository: https://github.com/ros-visualization/rqt
  license: BSD-3-Clause
  summary: rqt is a Qt-based framework for GUI development for ROS. It consists of three parts/metapackages<br/><ul><li>rqt (you're here)</li><li><a href="http://ros.org/wiki/rqt_common_plugins">rqt_common_plugins</a>- ROS backend tools suite that can be used on/off of robot runtime.</li><li><a href="http://ros.org/wiki/rqt_robot_plugins">rqt_robot_plugins</a>- Tools for interacting with robots during their runtime.</li></ul>rqt metapackage provides a widget<a href="http://ros.org/wiki/rqt_gui">rqt_gui</a>that enables multiple `rqt` widgets to be docked in a single window.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-distro-mutex 0.11.* humble_*
    - ros2-ros-environment
    - ros2-ros-workspace
    - setuptools
  run:
    - python
    - ros2-distro-mutex 0.11.* humble_*
    - ros2-ros-workspace
    - ros2-rqt-gui
    - ros2-rqt-gui-cpp
    - ros2-rqt-gui-py
    - ros2-rqt-py-common
