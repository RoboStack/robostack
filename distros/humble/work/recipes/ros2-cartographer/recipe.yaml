# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-cartographer
  version: 2.0.0
build:
  number: 22
  script: ''
requirements:
  run:
  - cartographer >=2.0.0, <2.1.0a0
  - ros2-distro-mutex 0.11.* humble_*
about:
  homepage: https://github.com/cartographer-project/cartographer
  repository: https://github.com/ros2/cartographer
  license: Apache-2.0
  summary: Cartographer is a system that provides real-time simultaneous localization and mapping (SLAM) in 2D and 3D across multiple platforms and sensor configurations.
extra:
  recipe-maintainers:
  - ros-forge
