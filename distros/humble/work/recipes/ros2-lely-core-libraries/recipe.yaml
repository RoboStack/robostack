# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-lely-core-libraries
  version: 0.2.13
source:
  git: https://github.com/ros2-gbp/ros2_canopen-release.git
  tag: release/humble/lely_core_libraries/0.2.13-1
  target_directory: ros2-lely-core-libraries/src/work
  patches:
    - patch/ros2-lely-core-libraries.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 22
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/ros-industrial/ros2_canopen
  license: Apache-2.0
  summary: ROS wrapper for lely-core-libraries
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
    - if: build_platform != target_platform
      then:
        - git
  host:
    - autoconf
    - automake
    - if: build_platform == target_platform
      then:
        - pkg-config
    - empy
    - libtool
    - numpy
    - pip
    - python
    - pyyaml
    - ros2-ament-cmake
    - ros2-distro-mutex 0.11.* humble_*
    - ros2-ros-environment
    - ros2-ros-workspace
    - if: build_platform == target_platform
      then:
        - git
  run:
    - empy
    - python
    - pyyaml
    - ros2-distro-mutex 0.11.* humble_*
    - ros2-ros-workspace
tests:
  - if: unix
    then:
      script:
        - python -c "import glob, os; p = os.environ['PREFIX']; assert glob.glob(os.path.join(p, 'lib', 'liblely-coapp.*')), 'liblely-coapp'; assert os.path.isfile(os.path.join(p, 'include', 'lely', 'coapp', 'master.hpp')), 'lely/coapp/master.hpp'"
