# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-gazebo-ros
  version: 3.9.0
source:
  git: https://github.com/ros2-gbp/gazebo_ros_pkgs-release.git
  tag: release/humble/gazebo_ros/3.9.0-1
  target_directory: ros2-gazebo-ros/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 22
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://classic.gazebosim.org/tutorials?cat=connect_ros
  repository: https://github.com/ros-simulation/gazebo_ros_pkgs
  license: Apache-2.0
  summary: Utilities to interface with<a href="http://classic.gazebosim.org">Gazebo</a>through ROS.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
  host:
    - ${{ 'libgl-devel' if linux }}
    - ${{ 'libopengl-devel' if linux }}
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-gtest
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-builtin-interfaces
    - ros2-distro-mutex 0.11.* humble_*
    - ros2-gazebo-dev
    - ros2-gazebo-msgs
    - ros2-geometry-msgs
    - ros2-launch-testing-ament-cmake
    - ros2-rcl
    - ros2-rclcpp
    - ros2-rclpy
    - ros2-rmw
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-ros2run
    - ros2-sensor-msgs
    - ros2-std-msgs
    - ros2-std-srvs
    - ros2-tinyxml-vendor
  run:
    - lxml
    - python
    - ros2-builtin-interfaces
    - ros2-distro-mutex 0.11.* humble_*
    - ros2-gazebo-dev
    - ros2-gazebo-msgs
    - ros2-geometry-msgs
    - ros2-launch-ros
    - ros2-rcl
    - ros2-rclcpp
    - ros2-rclpy
    - ros2-rmw
    - ros2-ros-workspace
    - ros2-sensor-msgs
    - ros2-std-srvs
    - ros2-tinyxml-vendor
