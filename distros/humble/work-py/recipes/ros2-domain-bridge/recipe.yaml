# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-domain-bridge
  version: 0.5.0
source:
  git: https://github.com/ros2-gbp/domain_bridge-release.git
  tag: release/humble/domain_bridge/0.5.0-1
  target_directory: ros2-domain-bridge/src/work
  patches:
    - patch/ros2-domain-bridge.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 22
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/ros2/domain_bridge
  license: Apache-2.0
  summary: ROS 2 Domain Bridge
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: osx
      then:
        - clang-tools ${{ (cxx_compiler_version ~ '.*') if cxx_compiler_version is defined else '*' }}
    - if: target_platform == 'emscripten-wasm32'
      then:
        - ros2-rosidl-default-generators
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros2-ament-cmake
    - ros2-ament-cmake-gmock
    - ros2-ament-lint-auto
    - ros2-ament-lint-common
    - ros2-distro-mutex 0.11.* humble_*
    - ros2-example-interfaces
    - ros2-launch
    - ros2-launch-testing
    - ros2-launch-testing-ament-cmake
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-rcutils
    - ros2-rmw-connextdds
    - ros2-rmw-cyclonedds-cpp
    - ros2-rmw-fastrtps-cpp
    - ros2-rmw-implementation-cmake
    - ros2-ros-environment
    - ros2-ros-workspace
    - ros2-rosbag2-cpp
    - ros2-rosgraph-msgs
    - ros2-rosidl-default-generators
    - ros2-rosidl-typesupport-cpp
    - ros2-test-msgs
    - ros2-zstd-vendor
    - yaml-cpp
  run:
    - python
    - ros2-distro-mutex 0.11.* humble_*
    - ros2-rclcpp
    - ros2-rclcpp-components
    - ros2-rcutils
    - ros2-ros-workspace
    - ros2-rosbag2-cpp
    - ros2-rosidl-default-runtime
    - ros2-rosidl-typesupport-cpp
    - ros2-zstd-vendor
    - yaml-cpp
