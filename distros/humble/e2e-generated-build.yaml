name: build
run-name: humble linux-64
on:
  push:
    branches:
    - buildbranch_humble_linux_64
concurrency:
  group: build-humble-linux-64
  cancel-in-progress: true
env:
  ROBOSTACK_DISTRO: humble
  ROBOSTACK_UPLOAD_CHANNEL: ${{ vars.ROBOSTACK_UPLOAD_CHANNEL }}
jobs:
  job_0:
    name: distro-mutex
    runs-on:
    - ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Disable git auto-maintenance
      run: git config --global maintenance.auto false && git config --global gc.auto 0
    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.11.0
      with:
        pixi-version: v0.81.0
        cache: 'true'
        log-level: v
        frozen: 'true'
    - name: Build
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN_HUMBLE }}
        CURRENT_RECIPES: ros2-distro-mutex
        BUILD_TARGET: linux-64
        PYTHONUNBUFFERED: '1'
      shell: bash
      run: |
        export CI=github
        export GIT_BRANCH=${GITHUB_REF_NAME}
        export FEEDSTOCK_NAME=${GITHUB_REPOSITORY##*/}
        .scripts/build_unix.sh --target $BUILD_TARGET
    - name: Keep build times
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: ${{ github.job }}-${{ github.run_attempt }}
        path: distros/humble/work/build_timings.jsonl
        if-no-files-found: ignore
        retention-days: 30
