# Temporary controls for the pull-request build (.github/workflows/testpr.yaml).
#
# testpr.yaml caches the packages it builds per pull request, and rattler-build
# skips everything that is already in that cache. This file tells it what to
# throw away before building. Set it in your PR, and reset it to the defaults
# below before or right after merging.

# Ignore the PR build cache and rebuild everything, e.g. for a full rebuild PR
# that bumps the build number of all packages.
full_rebuild: false

# Packages to drop from the PR build cache. Needed when a package changes without
# a new build number, e.g. you fixed one of its patches in patch/: the cache
# still holds the old build, so the fix would never be built in this PR.
#
# Entries are ROS package names (underscores or dashes) or globs; both package
# name prefixes (ros2-<pkg>, and ros-<distro>-<pkg> of older builds) are matched, e.g.
#
# evict_cache:
#   - rosidl_generator_py     # one package: ros2-rosidl-generator-py-*.conda
#   - std-msgs                # dashes work too
#   - "roboplan*"             # a family of packages (quote globs)
#
# Remember that dependents are not rebuilt automatically: evict them as well if
# they must pick up the change.
evict_cache:  # TEMPORARY (#62): reset to [] before merging
  - launch_pytest  # its pytest 8.4 patch
  # the version headers with the MSVC-safe *_VERSION_GTE (ament_cmake_gen_version_h
  # patch), and the packages that only had a Windows patch for it
  - ament_cmake_gen_version_h
  - ament_index_cpp
  - camera_calibration_parsers
  - camera_info_manager
  - controller_interface
  - controller_manager
  - hardware_interface
  - image_transport
  - joint_limits
  - point_cloud_transport
  - rcl
  - rcl_action
  - rcl_lifecycle
  - rcl_yaml_param_parser
  - rclcpp
  - rcpputils
  - tf2_ros
  - transmission_interface
  - behaviortree_cpp
  - moveit_visual_tools
