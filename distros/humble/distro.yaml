# Settings of ros-humble that differ from the other distributions
# (everything else is shared, see the README).
channel_name: robostack-staging
upload_target: anaconda
pinning_overrides:
  # nav2_mppi_controller lists xsimd before xtensor: unpinned, the solver takes the newest
  # xsimd (14), which no xtensor >= 0.25 accepts, and falls back to xtensor 0.23.9, whose
  # xtensor_simd.hpp doesn't build with it. 0.25 brings a matching xsimd (as in jazzy).
  xtensor: [0.25.0]
rosdistro_sync: humble/2026-10-12
