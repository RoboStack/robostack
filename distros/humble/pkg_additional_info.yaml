    if: win
    then: "-DBUILD_TOOLS=OFF -DBUILD_EXAMPLES=OFF -DWITH_GTSAM=OFF"
    else: "-DBUILD_TOOLS=OFF -DBUILD_EXAMPLES=OFF"
  build_number: 26  # built with Qt (its GUI library, for rtabmap_viz)
rtabmap_rviz_plugins:  # rviz on Qt 6
  build_number: 26
