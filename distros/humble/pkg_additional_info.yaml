apriltag:
  generate_dummy_package_with_run_deps:
    dep_name: apriltag
    max_pin: 'x.x.x'
as2_behaviors_trajectory_generation:
  # conda-forge's NLopt (and glog, gflags) for the dynamic_trajectory_generator it fetches, so that
  # doesn't build NLopt itself (fails with CMake 4); see patch/ros2-as2-behaviors-trajectory-generation.patch
  add_host: ["nlopt", "glog", "gflags"]
  add_run: ["nlopt", "glog", "gflags"]
autoware_trajectory:
  remove_host: ["ros2-tl-expected"]
  remove_run: ["ros2-tl-expected"]
  add_host: ["cpp-expected"]
  add_run: ["cpp-expected"]
aws_sdk_cpp_vendor:
  add_host: ["aws-sdk-cpp"]
  add_run: ["aws-sdk-cpp"]
backward_ros:
  # binutils linux-only: -liberty not found on macOS.
  add_host: ["${{ 'binutils' if linux }}", "${{ 'elfutils' if linux }}", "ros2-ament-cmake-libraries"]
behaviortree_cpp_v3:
  add_host: ["libboost-devel", "cppzmq"]
  add_run: ["libboost"]
cartographer:
  # Dummy package; drop unpinned lua/gflags, they conflict with the real cartographer's pins.
  remove_host: ["lua", "gflags"]
  remove_run: ["lua", "gflags"]
cartographer_ros:
  additional_cmake_args: "-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON"
  add_host: ["cartographer 2.*", "libboost-devel"]
console_bridge_vendor:
  add_host: ["console_bridge"]
  add_run: ["console_bridge"]
depthai:
  add_host: ["${{ 'elfutils' if linux }}"]
eigenpy:
  generate_dummy_package_with_run_deps:
    dep_name: eigenpy
    max_pin: 'x.x.x'
    # the version in ros is not compatible with conda-forge's coal and hpp_fcl builds
    override_version: '3.13.0'
fastrtps:
  additional_cmake_args:
    if: unix
    then: '-DCMAKE_CXX_FLAGS="-include cstdint"'
foxglove_bridge:
  add_host: ["ros2-ament-cmake"]
generate_parameter_library:
  remove_host: ["ros2-tl-expected"]
  remove_run: ["ros2-tl-expected"]
  add_host: ["cpp-expected"]
  add_run: ["cpp-expected"]
geometric_shapes:
  add_host: ["libboost-devel", "octomap"]
gtsam:
  generate_dummy_package_with_run_deps:
    dep_name: gtsam
    max_pin: 'x.x'
    # humble is on 4.2.0, but we stick to 4.2.1 for compat with the rest of conda-forge
    override_version: '4.2.1'
hpp_fcl:
  generate_dummy_package_with_run_deps:
    dep_name: hpp-fcl
    max_pin: 'x.x.x'
    # the version on ros is outdated w.r.t. to the conda-forge one
    override_version: '3.0.4'
iceoryx_binding_c:
  generate_dummy_package_with_run_deps:
    dep_name: libiceoryx-binding-c
    max_pin: 'x.x'
    override_version: '2.95.8'
iceoryx_hoofs:
  generate_dummy_package_with_run_deps:
    dep_name: libiceoryx-hoofs
    max_pin: 'x.x'
    override_version: '2.95.8'
iceoryx_posh:
  generate_dummy_package_with_run_deps:
    dep_name: libiceoryx-posh
    max_pin: 'x.x'
    override_version: '2.95.8'
ignition_cmake2_vendor:
  additional_cmake_args: "-DAMENT_VENDOR_POLICY=NEVER_VENDOR_IGNORE_SATISFIED_CHECK -DBUILD_TESTING=OFF"
ignition_math6_vendor:
  additional_cmake_args: "-DAMENT_VENDOR_POLICY=NEVER_VENDOR_IGNORE_SATISFIED_CHECK -DBUILD_TESTING=OFF"
image_view:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
  # Depends on opencv with gui support, see  https://github.com/ros-perception/image_pipeline/blob/746268fcfd21b389bc39ae60bb6345a53c838558/image_view/src/stereo_view_node.cpp#L253
  add_run: ["libopencv * *qt6*"]
intra_process_demo:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
  # Depends on opencv with gui support, see https://github.com/ros2/demos/blob/8f361a1ece2daae54016959f3ea9ab2e7692ddbb/intra_process_demo/include/image_pipeline/image_view_node.hpp#L58
  add_run: ["libopencv * *qt6*"]
kdl_parser:
  # package.xml doesn't declare eigen3_cmake_module, but orocos_kdl_vendor's cmake needs it.
  add_host: ["ros2-eigen3-cmake-module"]
lbr_description:
  remove_run: ["ros2-gz-ros2-control"]
  add_run: ["${{ 'ros2-gz-ros2-control' if linux }}"]
lbr_ros2_control:
  add_host: ["ros2-kinematics-interface"]
  add_run: ["ros2-kinematics-interface"]
libcamera:
  generate_dummy_package_with_run_deps:
    dep_name: libcamera
    # see https://git.libcamera.org/libcamera/libcamera.git/tree/meson.build?h=v0.5.1#n65
    max_pin: 'x.x'
    # humble is on 0.1.0, but we stick to 0.5.0 for compat
    override_version: '0.5.0'
libg2o:
  additional_cmake_args: "-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON"
  add_host: ["${{ 'libglu' if linux }}", "${{ 'freeglut' if not osx }}"]
librealsense2:
  generate_dummy_package_with_run_deps:
    dep_name: librealsense
    max_pin: 'x.x'
    override_version: 2.58.3  # Until: https://github.com/conda-forge/librealsense-feedstock/pull/91
libstatistics_collector:
  add_host: ["ros2-yaml-cpp-vendor"]
mimick_vendor:
  # its FetchContent'd mimick has cmake_minimum_required < 3.5 (CMake 4 rejects that)
  additional_cmake_args: "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  add_build: ["vcstool"]
moveit_visual_tools:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
mrpt_gui:
  # Overrides shared/: this distribution maps Qt to qt-main 5.15, whose builds need
  # gstreamer <1.27, while the pinned wxwidgets (3.3.3) needs gstreamer 1.28. A version
  # spec bypasses that pin, so the solver picks a wxwidgets that coexists with qt-main.
  add_host: ["wxwidgets >=3.2", "${{ 'glad' if win }}"]  # glad: as in shared/
nav2_constrained_smoother:
  add_host: ["${{ 'openblas' if win }}"]
nav2_util:
  add_host: ["libboost-devel"]
octomap:
  generate_dummy_package_with_run_deps:
    dep_name: octomap
    max_pin: 'x.x'
    # humble is on 1.9.8, but we stick to 1.10.0 for compat
    override_version: '1.10.0'
ompl:
  generate_dummy_package_with_run_deps:
    dep_name: ompl
    max_pin: 'x.x'
    # OMPL 2 is rebuilt for Boost 1.90 on all supported platforms.
    override_version: '2.0.1'
opennav_coverage:
  # package.xml misses deps that CMakeLists.txt finds
  add_host: [ros2-rclcpp-components, ros2-std-msgs, ros2-visualization-msgs]
  add_run: [ros2-rclcpp-components, ros2-std-msgs, ros2-visualization-msgs]
openvdb_vendor:
  add_host: ["openvdb"]
parameter_traits:
  remove_host: ["ros2-tl-expected"]
  remove_run: ["ros2-tl-expected"]
  add_host: ["cpp-expected"]
  add_run: ["cpp-expected"]
pcl_conversions:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "libboost-devel"]
polygon_rviz_plugins:
  add_host: ["libgl-devel"]
  add_run: ["libgl-devel"]
proxsuite:
  generate_dummy_package_with_run_deps:
    dep_name: proxsuite
    max_pin: 'x.x'
    # the version on ros is outdated w.r.t. to the conda-forge one
    override_version: '0.7.3'
# remember on next rebuild to remove build number override
py_trees:
  generate_dummy_package_with_run_deps:
    dep_name: py-trees
    max_pin: 'x.x.x'
    override_version: 2.6.0
  add_host: ["hatchling"]  # 2.6 builds with hatchling (as in jazzy/lyrical)
py_trees_js:
  add_host: ["hatchling"]
py_trees_ros_tutorials:
  # the mock GUI is ported to PyQt6 (patch/ros2-py-trees-ros-tutorials.patch): PyQt5 and
  # PyQt6 (the rqt stack) can't be installed together
  remove_run: ["pyqt", "pyqt-builder"]
  add_run: ["pyqt6"]
pybind11_json_vendor:
  add_host: ["pybind11_json"]
  add_run: ["pybind11_json"]
python_qt_binding:
  # pyside2 has no python 3.14 build; port to PyQt6 instead.
  remove_host: ["qt-main", "pyqt"]
  remove_run: ["qt-main", "pyqt"]
  # sip <6.16: 6.16.x regressed ABI targeting for PyQt-based bindings.
  add_host: ["pyqt-builder", "pep517", "qt6-main", "pyqt6", "sip <6.16"]
  add_run: ["pyqt-builder", "pep517", "qt6-main", "pyqt6"]
qt_gui:
  # Same PyQt6 port as python_qt_binding/qt_gui_cpp below.
  remove_host: ["qt-main", "pyqt"]
  remove_run: ["qt-main", "pyqt"]
  add_host: ["qt6-main", "pyqt6"]
  add_run: ["qt6-main", "pyqt6"]
qt_gui_cpp:
  # Ported to PyQt6, see patch/ros2-qt-gui-cpp.patch.
  remove_host: ["qt-main", "pyqt"]
  remove_run: ["qt-main", "pyqt"]
  add_build: ["${{ 'pyqt6' if (build_platform != target_platform) }}", "${{ 'qt6-main' if (build_platform != target_platform) }}"]
  # sip pinned directly for the same reason as python_qt_binding above.
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "pyqt-builder", "pep517", "qt6-main", "pyqt6", "sip <6.16"]
  add_run: ["pyqt-builder", "pep517", "qt6-main", "pyqt6"]
rcl:
  add_host: ["ros2-yaml-cpp-vendor"]
rcl_action:
  add_host: ["ros2-yaml-cpp-vendor"]
rclc:
  add_host: ["ros2-yaml-cpp-vendor"]
rclcpp:
  add_host: ["ros2-yaml-cpp-vendor"]
rclcpp_action:
  add_host: ["ros2-yaml-cpp-vendor"]
rclpy:
  add_host: ["typing_extensions"]
  add_run: ["typing_extensions"]
rmw_implementation:
  add_host:
  - "ros2-yaml-cpp-vendor"
  - "fmt"
ros_gz_sim:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
ros_ign_gazebo:
  add_host: ["ros2-std-msgs", "ros2-rclcpp", "${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
ros_ign_interfaces:
  add_host: ["ros2-rcl-interfaces"]
ros_image_to_qimage:
  # Same PyQt6 port as qt_gui_cpp/rqt_gui_cpp above (patch/ros2-ros-image-to-qimage.patch).
  remove_host: ["qt-main"]
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "qt6-main"]
rqt_gui_cpp:
  remove_host: ["qt-main"]
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "qt6-main"]
rqt_image_overlay:
  # Same PyQt6 port as qt_gui_cpp/rqt_gui_cpp above (patch/ros2-rqt-image-overlay.patch).
  remove_host: ["qt-main"]
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "qt6-main"]
rqt_image_overlay_layer:
  # Same PyQt6 port as qt_gui_cpp/rqt_gui_cpp above (patch/ros2-rqt-image-overlay-layer.patch).
  remove_host: ["qt-main"]
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "qt6-main"]
rqt_image_view:
  remove_host: ["qt-main"]
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "qt6-main"]
rqt_py_common:
  remove_host: ["qt-main"]
  add_host: ["qt6-main"]
rtabmap:
  additional_cmake_args:
    if: win
    then: "-DWITH_QT=OFF -DBUILD_TOOLS=OFF -DBUILD_EXAMPLES=OFF -DWITH_GTSAM=OFF"
    else: "-DWITH_QT=OFF -DBUILD_TOOLS=OFF -DBUILD_EXAMPLES=OFF"
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "ceres-solver", "${{ 'libdc1394' if not win }}", "libusb", "vtk"]
  remove_host: ["ros2-qt-gui-cpp"]
  remove_run: ["ros2-qt-gui-cpp"]
rviz_ogre_vendor:
  add_host: ["zlib", "freeimage", "freetype", "assimp", "zziplib", "pugixml", "${{ 'libglu' if linux }}"]
  add_build: ["vcstool"]
  add_run: ["assimp"]
slam_toolbox:
  add_build: ["${{ 'qt-main' if (build_platform != target_platform) }}"]
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
spdlog_vendor:
  add_host: ["spdlog"]
  add_run: ["spdlog"]
uncrustify_vendor:
  add_host: ["uncrustify"]
  add_run: ["uncrustify"]
ur_moveit_config:
  add_host: ["ros2-rclpy"]
  add_run: ["ros2-rclpy"]
urdfdom:
  generate_dummy_package_with_run_deps:
    dep_name: urdfdom
    max_pin: 'x.x'
    # the version on ros is outdated w.r.t. to the conda-forge one
    override_version: '6.0.0'
urdfdom_headers:
  generate_dummy_package_with_run_deps:
    dep_name: urdfdom_headers
    max_pin: 'x.x'
    override_version: '3.0.0'
vision_msgs_rviz_plugins:
  add_build: ["${{ 'qt-main' if (build_platform != target_platform) }}"]
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
warehouse_ros_sqlite:
  add_host: ["ros2-sqlite3-vendor"]
  add_run: ["ros2-sqlite3-vendor"]
# Remove build_number fields below on new full rebuild
zenoh_cpp_vendor:
  additional_cmake_args: "-DAMENT_VENDOR_POLICY=NEVER_VENDOR_IGNORE_SATISFIED_CHECK -DUSE_SYSTEM_ZENOH=ON"
ament_cmake_gmock:  # as ament_cmake_gtest
  build_number: 23
ament_cmake_gtest:  # uses conda-forge's gtest instead of gtest_vendor's sources
  build_number: 23
aruco_ros:  # its recipe test stops the node for sure (package tests hung on macOS)
  build_number: 23
plotjuggler:
  build_number: 24
  add_host: ["libxcb", "${{ 'elfutils' if linux }}", "ros2-ros-workspace", "git-lfs"]
rtabmap_slam:  # its recipe test stops the node for sure (package tests hung on macOS)
  build_number: 23
spatio_temporal_voxel_layer:
  build_number: 23
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "openvdb"]
tracetools:
  build_number: 24
  remove_host: ["pkg-config"]
urdf:  # drop deprecated urdf_world/types.h include (ros2/urdf#54) for headers 3.x
  build_number: 23
urdf_parser_plugin:  # use urdf_model/types.h (ros2/urdf#54) for headers 3.x
  build_number: 23
