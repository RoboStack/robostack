tests:
  # Smoke test: `fuse_optimizers/fixed_lag_smoother_node` (fuse's optimizer node) starts (loads its libraries and the RMW) and is still running after 5 s. It's stopped (killed if SIGTERM doesn't end it) before the test exits, or the test runner waits for it.
  - script:
      - python -c "import os, subprocess, sys, time; d = os.path.join(os.environ['PREFIX'], 'Library') if os.name == 'nt' else os.environ['PREFIX']; p = subprocess.Popen([os.path.join(d, 'lib', 'fuse_optimizers', 'fixed_lag_smoother_node')]); time.sleep(5); r = p.poll(); p.terminate(); time.sleep(3); p.kill(); p.wait(); sys.exit(0 if r is None else 1)"
