tests:
  # The package and its robot presets import (rclpy and the message packages load).
  - python:
      imports:
        - pymoveit2
        - pymoveit2.robots.panda
      pip_check: false
  # Smoke test without a running MoveIt: the arm and gripper interfaces of the Panda preset are created on a node (action and service clients for move_group), and the arm interface receives a JointState published on the same node.
  - script:
      - python pymoveit2_smoke_test.py
    files:
      recipe:
        - pymoveit2_smoke_test.py
