tests:
  # Smoke test: `aruco_ros/single` (the marker detector) starts (loads its libraries and the RMW) and is still running after 5 s. It's stopped (killed if SIGTERM doesn't end it) before the test exits, or the test runner waits for it.
  - if: unix
    then:
      script:
        - python -c "import os, subprocess, sys, time; p = subprocess.Popen([os.path.join(os.environ['PREFIX'], 'lib', 'aruco_ros', 'single')]); time.sleep(5); r = p.poll(); p.terminate(); time.sleep(3); p.kill(); p.wait(); sys.exit(0 if r is None else 1)"
  - if: win
    then:
      script:
        - if not exist %LIBRARY_LIB%\aruco_ros\single.exe exit 1
