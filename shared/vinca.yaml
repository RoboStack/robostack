# vinca settings shared by every distribution; distros/<d>/vinca.yaml adds its own
# (lists are combined, other keys from the distribution win). See tools/robostack.py.
package_name_mode: both
# relative to this file; each distribution adds its own (see distros/<d>/vinca.yaml)
conda_index:
  - robostack.yaml
patch_dir: patch

# The distro mutex: every distribution sets its own version. It only keeps one ROS
# distribution per environment: no run_constraints. Library versions follow from
# the packages' own dependencies (run_exports); where those are wrong, fix the
# package's metadata (patch/, pkg_additional_info.yaml, or a conda-forge repodata
# patch) instead. Mutex constraints applied to every user environment, also to
# packages it doesn't use, and made solvers fall back to old ROS builds when
# another library needed a different version. `rs check` rejects them.
mutex_package:
  name: "ros2-distro-mutex"
  upper_bound: "x.x"

# pixi used by the generated build workflows; keep in sync with .github/workflows.
setup_pixi_version: "0.11.0"
pixi_version: "0.81.0"

