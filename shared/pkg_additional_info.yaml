libpointmatcher:
  # Windows installs libpointmatcherConfig.cmake into both <prefix>/Library/cmake and
  # share/libpointmatcher/cmake but its export file only into the latter; CMake finds the
  # former first and fails to include libpointmatcher-config.cmake. Keep both together.
  additional_cmake_args:
    if: win
    then: "-DINSTALL_CMAKE_DIR=share/libpointmatcher/cmake"
