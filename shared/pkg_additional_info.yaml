# rtabmap_odom/slam/util/viz on Windows: rtabmap::core links some PCL libraries by bare
# name (pcl_visualization, pcl_keypoints; RTABMapConfig.cmake creates no imported target
# for them), so add the library directory to the link path; NOMINMAX for Eigen vs windows.h.
rtabmap_odom:
  additional_cmake_args:
    if: win
    then: '-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON -DCMAKE_CXX_FLAGS_INIT=/DNOMINMAX -DCMAKE_SHARED_LINKER_FLAGS_INIT=/LIBPATH:%LIBRARY_LIB% -DCMAKE_EXE_LINKER_FLAGS_INIT=/LIBPATH:%LIBRARY_LIB%'
