mrpt_common:
  # CMakeLists.txt calls find_package(ament_cmake) when ROS_VERSION=2 (set by ros_environment),
  # but package.xml (build_type cmake) does not declare it
  add_host: ["ros2-ament-cmake"]
mrpt_gui:  # Windows: wxWidgets' and nanogui's GUI code needs GDI, which the ROS build scripts' CL=/DNOGDI=1 hides
  additional_cmake_args:
    if: win
    then: "-DCMAKE_CXX_FLAGS_INIT=/UNOGDI -DCMAKE_C_FLAGS_INIT=/UNOGDI"
  # links libwx_*; the wxwidgets/wx-common keys map to wxpython, so wxwidgets is only a
  # transitive host dep and its (weak) run_exports never reach the run requirements
  # Windows: nanogui links conda-forge's glad instead of its bundled copy (ros2-mrpt-gui.win.patch)
  add_host: ["wxwidgets", "${{ 'glad' if win }}"]
mrpt_imgui:
  # Windows: links conda-forge's GLEW like mrpt_opengl, also for its users (ros2-mrpt-imgui.win.patch)
  add_host: ["${{ 'glew' if win }}"]
  add_run: ["${{ 'glew' if win }}"]
mrpt_libros_bridge:  # exports no symbols on Windows: no import library for its tests
  additional_cmake_args: "-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON"
mrpt_math:
  # its public headers include Eigen, and its exported CMake targets (and mrpt_poses') carry
  # the eigen3 include directory: users need the headers (eigen-abi-devel's run_exports only
  # add eigen-abi), or dependents without their own eigen dependency fail to configure
  add_run: ["eigen"]
mrpt_opengl:
  # Windows: the release source has no bundled GLEW (ros2-mrpt-opengl.win.patch); users of
  # opengl_api.h need GL/glew.h too
  add_host: ["${{ 'glew' if win }}"]
  add_run: ["${{ 'glew' if win }}"]
mujoco_ros2_control_plugins:
  add_host:
  - if: linux
    then: ["libegl-devel"]  # CMake finds OpenGL COMPONENTS EGL
mujoco_vendor:
  additional_cmake_args: "-DAMENT_VENDOR_POLICY=NEVER_VENDOR_IGNORE_SATISFIED_CHECK"
  add_host: ["libmujoco"]  # conda-forge's MuJoCo (linux, osx, win) instead of the bundled build
