gz_sim_vendor:
  additional_cmake_args: "-DAMENT_VENDOR_POLICY=NEVER_VENDOR_IGNORE_SATISFIED_CHECK"
  # Rebuild with qt6-main 6.11 (b29 was built against qt6-main 6.12, which pyqt6 6.11 can't install with).
gz_transport_vendor:
  additional_cmake_args: "-DAMENT_VENDOR_POLICY=NEVER_VENDOR_IGNORE_SATISFIED_CHECK"
gz_utils_vendor:
  additional_cmake_args: "-DAMENT_VENDOR_POLICY=NEVER_VENDOR_IGNORE_SATISFIED_CHECK"
imu_complementary_filter:
  additional_cmake_args: "-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON"
imu_tools:
  additional_cmake_args: "-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON"
io_context:
  additional_cmake_args: "-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON"
lanelet2_projection:
  additional_cmake_args: "-DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_STANDARD_REQUIRED=ON -DCMAKE_CXX_EXTENSIONS=OFF"
lanelet2_python:
  additional_cmake_args: "-DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_STANDARD_REQUIRED=ON -DCMAKE_CXX_EXTENSIONS=OFF"
libcurl_vendor:
  additional_cmake_args: "-DAMENT_VENDOR_POLICY=NEVER_VENDOR_IGNORE_SATISFIED_CHECK"
libfranka:
  generate_dummy_package_with_run_deps:
    dep_name: libfranka
    max_pin: 'x.x.x'
    # humble is on 0.20.4, but we stick to conda-forge's latest for compat with the rest of conda-forge
    override_version: '0.21.3'
liblz4_vendor:
  additional_cmake_args: "-DAMENT_VENDOR_POLICY=NEVER_VENDOR_IGNORE_SATISFIED_CHECK"
libnabo:
  additional_cmake_args: "-DLIBNABO_BUILD_PYTHON=OFF"
libpointmatcher:
  # Windows installs libpointmatcherConfig.cmake into both <prefix>/Library/cmake and
  # share/libpointmatcher/cmake but its export file only into the latter; CMake finds the
  # former first and fails to include libpointmatcher-config.cmake. Keep both together.
  additional_cmake_args:
    if: win
    then: "-DINSTALL_CMAKE_DIR=share/libpointmatcher/cmake"
moveit_ros_visualization:
  additional_cmake_args: "-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON"
mujoco_vendor:
  additional_cmake_args: "-DAMENT_VENDOR_POLICY=NEVER_VENDOR_IGNORE_SATISFIED_CHECK"
octomap_ros:
  additional_cmake_args: "-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON"
onnxruntime_vendor:
  additional_cmake_args: "-DAMENT_VENDOR_POLICY=NEVER_VENDOR_IGNORE_SATISFIED_CHECK"
openvdb_vendor:
  additional_cmake_args: "-DAMENT_VENDOR_POLICY=NEVER_VENDOR_IGNORE_SATISFIED_CHECK"
orocos_kdl_vendor:
  additional_cmake_args: "-DAMENT_VENDOR_POLICY=NEVER_VENDOR_IGNORE_SATISFIED_CHECK"
ouster_ros:
  additional_cmake_args: "-DOUSTER_USE_VCPKG_IF_AVAILABLE=OFF"
pcl_ros:
  additional_cmake_args: "-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON"
pinocchio:
  generate_dummy_package_with_run_deps:
    dep_name: pinocchio
    max_pin: 'x.x.x'
    # the version on ros is outdated w.r.t. to the conda-forge one
    override_version: '4.1.0'
pybind11_json_vendor:
  additional_cmake_args: "-DAMENT_VENDOR_POLICY=NEVER_VENDOR"
pybind11_vendor:
  additional_cmake_args: "-DAMENT_VENDOR_POLICY=NEVER_VENDOR"
rmf_building_sim_common:  # shared libraries without dllexport annotations (Windows: no import library)
  additional_cmake_args: "-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON"
rmf_robot_sim_common:  # shared libraries without dllexport annotations (Windows: no import library)
  additional_cmake_args: "-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON"
rmf_visualization_rviz2_plugins:  # Windows: uses the alternative operator tokens (`or`), which MSVC only has with <iso646.h>
  additional_cmake_args:
    if: win
    then: '-DCMAKE_CXX_FLAGS_INIT=/FIiso646.h'
rmf_visualization_schedule:  # Windows: its test's link command exceeds the linker's line limit (LNK1170)
  additional_cmake_args:
    if: win
    then: '-DBUILD_TESTING=OFF'
robot_state_publisher:
  additional_cmake_args: "-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON"
rosx_introspection:
  additional_cmake_args: "-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON"
rtabmap_conversions:
  additional_cmake_args: "-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON"
# rtabmap_odom/slam/util/viz on Windows: rtabmap::core links some PCL libraries by bare
# name (pcl_visualization, pcl_keypoints; RTABMapConfig.cmake creates no imported target
# for them), so add the library directory to the link path; NOMINMAX for Eigen vs windows.h.
rtabmap_odom:
  additional_cmake_args:
    if: win
    then: '-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON -DCMAKE_CXX_FLAGS_INIT=/DNOMINMAX -DCMAKE_SHARED_LINKER_FLAGS_INIT=/LIBPATH:%LIBRARY_LIB% -DCMAKE_EXE_LINKER_FLAGS_INIT=/LIBPATH:%LIBRARY_LIB%'
rtabmap_slam:
  additional_cmake_args:
    if: win
    then: '-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON -DCMAKE_CXX_FLAGS_INIT=/DNOMINMAX -DCMAKE_SHARED_LINKER_FLAGS_INIT=/LIBPATH:%LIBRARY_LIB% -DCMAKE_EXE_LINKER_FLAGS_INIT=/LIBPATH:%LIBRARY_LIB%'
rtabmap_util:
  additional_cmake_args:
    if: win
    then: '-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON -DCMAKE_CXX_FLAGS_INIT=/DNOMINMAX -DCMAKE_SHARED_LINKER_FLAGS_INIT=/LIBPATH:%LIBRARY_LIB% -DCMAKE_EXE_LINKER_FLAGS_INIT=/LIBPATH:%LIBRARY_LIB%'
rtabmap_viz:
  additional_cmake_args:
    if: win
    then: '-DCMAKE_CXX_FLAGS_INIT=/DNOMINMAX -DCMAKE_SHARED_LINKER_FLAGS_INIT=/LIBPATH:%LIBRARY_LIB% -DCMAKE_EXE_LINKER_FLAGS_INIT=/LIBPATH:%LIBRARY_LIB%'
sbg_driver:
  additional_cmake_args:
    if: win
    then: '-DCMAKE_CXX_FLAGS="-D_USE_MATH_DEFINES"'
sdformat_vendor:
  additional_cmake_args: "-DAMENT_VENDOR_POLICY=NEVER_VENDOR_IGNORE_SATISFIED_CHECK"
sick_scan_xd:
  additional_cmake_args: "-DBUILD_DEBUG_TARGET:BOOL=OFF -DROS_VERSION=2"
spdlog_vendor:
  additional_cmake_args: "-DAMENT_VENDOR_POLICY=NEVER_VENDOR_IGNORE_SATISFIED_CHECK"
sqlite3_vendor:
  additional_cmake_args: "-DAMENT_VENDOR_POLICY=NEVER_VENDOR_IGNORE_SATISFIED_CHECK"
toppra:
  generate_dummy_package_with_run_deps:
    dep_name: toppra-python
    max_pin: 'x.x'
ublox_gps:
  additional_cmake_args: "-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON"
uncrustify_vendor:
  additional_cmake_args: "-DAMENT_VENDOR_POLICY=NEVER_VENDOR_IGNORE_SATISFIED_CHECK"
urdfdom_py:
  generate_dummy_package_with_run_deps:
    dep_name: urdfdom-py
    max_pin: 'x.x'
velodyne_laserscan:  # Windows (pulled in by rtabmap_examples): M_PI, and its library exports no symbols
  additional_cmake_args:
    if: win
    then: '-DCMAKE_CXX_FLAGS_INIT=/D_USE_MATH_DEFINES -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON'
visp:
  generate_dummy_package_with_run_deps:
    dep_name: visp
    max_pin: 'x.x'
    # rosdistro's visp is older than conda-forge's, which is built against the current
    # OpenCV/protobuf (3.6.x needs OpenCV 4, i.e. protobuf < 7)
    override_version: '3.7.0'
