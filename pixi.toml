[workspace]
name = "robostack"
description = "RoboStack: conda packages for all ROS 2 distributions, from one repository"
authors = ["Tobias Fischer <tobias.fischer@qut.edu.au>", "Wolf Vollprecht <w.vollprecht@gmail.com>", "Silvio Traversaro <silvio@traversaro.it>", "Daisuke Nishimatsu <daisuke.nishimatsu1021@gmail.com>"]
channels = ["https://prefix.dev/conda-forge"]
platforms = [
  "osx-arm64",
  # 2.17 is the glibc version used in CentOS 7
  { platform = "linux-64", glibc = "2.17" },
  "osx-64",
  { platform = "linux-aarch64", glibc = "2.17" },
  "win-64",
]

[target.win.activation.env]
PYTHONIOENCODING = "utf-8"

[dependencies]
python = ">=3.14.0,<3.15"
rattler-build = ">=0.80.0,<0.81"
cmake = "<4.0"
setuptools = "<82.0"
rattler-index = ">=0.27.16"
pyyaml = "*"
# Some git repos need git-lfs, see https://github.com/RoboStack/ros-jazzy/issues/118
git-lfs = "*"
pytest = ">=9.1.1,<10"
# gh for the workflows: one version everywhere (the runner's is not on PATH on Windows)
gh = ">=2.102.0,<3"

[target.win-64.dependencies]
vinca-rs = { url = "https://github.com/Tobias-Fischer/vinca-rs/releases/download/v0.1.3/vinca-rs-0.1.3-he01afda_0.conda", sha256 = "e4faa0e18b7a24e3b6d8286b5a1fee8c937357657d3ff49d93fc2fae7b57585f" }  # vinca-rs: tools/pin_vinca_rs.py
# patch is required by rattler-build
m2-patch = "*"
# git is required by rattler-build
git = "*"

[pypi-dependencies]
# One vinca for all distributions.
vinca = { git = "https://github.com/RoboStack/vinca.git", rev = "74d1e856d5b00c0cb5ee0c1be41dac4afcae7bf5" }
# For local development, temporarily use (and regenerate pixi.lock):
# vinca = { path = "../vinca", editable = true }

[tasks]
rs = { cmd = "python tools/robostack.py", description = "Run a task for one distribution: `pixi run rs <distro> <task>` (generate-recipes, build, build-one, check-patches, check-deps, create-snapshot, render-pinning, sort, ...)." }
sort = { cmd = "sh -lc 'vinca-sort-vinca-lists $@ shared/vinca.yaml && vinca-sort-yaml-keys $@ shared/robostack.yaml shared/pkg_additional_info.yaml shared/patch/dependencies.yaml && for d in distros/*/; do (cd $d && vinca-sort-vinca-lists $@ vinca.yaml && vinca-sort-yaml-keys $@ pkg_additional_info.yaml rosdistro_additional_recipes.yaml $(ls patch/dependencies.yaml 2>/dev/null)) || exit 1; done' --", description = "Sort the YAML files of all distributions (`--check` to only check)." }
test = { cmd = "python -m pytest tools/tests", description = "Unit tests of the repository tooling (tools/tests)." }
abi-check = { cmd = "pixi exec -s python=3.14 -s zstandard -s pyyaml -s pyelftools python tools/abi_check.py", description = "Compare the ABI of package builds with libabigail (Linux only): `pixi run abi-check --distro jazzy --latest-pairs 30`, `--old a.conda --new b.conda`, or `--pr-builds <dir>` (a pull request's builds against the released ones)." }
render-pinning = { cmd = "sh -lc 'for d in distros/*/; do python tools/robostack.py $(basename $d) render-pinning || exit 1; done'", description = "Regenerate every distribution's conda_build_config.yaml from shared/pinning and its distro.yaml." }

[target.linux-64.dependencies]  # vinca-rs: tools/pin_vinca_rs.py
vinca-rs = { url = "https://github.com/Tobias-Fischer/vinca-rs/releases/download/v0.1.3/vinca-rs-0.1.3-h41f06ac_0.conda", sha256 = "6dc3e6df7405693d0289c4f0ece1799cb6b28d15c7abb6e4a33e3fc323ef420f" }  # vinca-rs: tools/pin_vinca_rs.py

[target.linux-aarch64.dependencies]  # vinca-rs: tools/pin_vinca_rs.py
vinca-rs = { url = "https://github.com/Tobias-Fischer/vinca-rs/releases/download/v0.1.3/vinca-rs-0.1.3-h11eb1b2_0.conda", sha256 = "1c641960ae5bde5d175f43290c97b046092f73dd1663feb2ce272f0a2611b00c" }  # vinca-rs: tools/pin_vinca_rs.py

[target.osx-64.dependencies]  # vinca-rs: tools/pin_vinca_rs.py
vinca-rs = { url = "https://github.com/Tobias-Fischer/vinca-rs/releases/download/v0.1.3/vinca-rs-0.1.3-h4778241_0.conda", sha256 = "768dd2095fcea4680cd95a5304b201eb89468bc595a4f1a8bde8d882d939ab08" }  # vinca-rs: tools/pin_vinca_rs.py

[target.osx-arm64.dependencies]  # vinca-rs: tools/pin_vinca_rs.py
vinca-rs = { url = "https://github.com/Tobias-Fischer/vinca-rs/releases/download/v0.1.3/vinca-rs-0.1.3-hea27dcd_0.conda", sha256 = "663a0102be34388675efac416bcba0d5c9ea67561c241348447b5c70eff8fef8" }  # vinca-rs: tools/pin_vinca_rs.py
